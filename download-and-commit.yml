name: Download APK and Commit to Repository

on:
  workflow_dispatch:  # با کلیک دکمه اجرا میشه

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download APK using gh-proxy
        run: |
          curl -L -o app-debug.apk "https://gh-proxy.com/https://github.com/thecybersandeep/Frida-Launcher/releases/download/v2/app-debug.apk"
      
      - name: Create ZIP archive
        run: |
          zip app-debug.zip app-debug.apk
      
      - name: Commit and push the file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app-debug.zip
          git commit -m "Add Frida Launcher APK as ZIP" || echo "No changes to commit"
          git push
