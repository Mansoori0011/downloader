name: Download any file

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'آدرس کامل فایل (مثل لینک گیت‌هاب یا هر سایت دیگر)'
        required: true
        type: string
      file_name:
        description: 'نام دلخواه برای فایل (مثل my-app.apk یا video.mp4)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download file
        run: |
          curl -L -o "${{ github.event.inputs.file_name }}" "${{ github.event.inputs.file_url }}"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ github.event.inputs.file_name }}"
          git commit -m "Add downloaded file: ${{ github.event.inputs.file_name }}" || echo "No changes"
          git push
