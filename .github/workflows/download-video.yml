name: دانلود فیلم 

on:
  workflow_dispatch:
    inputs:
      video_number:
        description: 'شماره فیلم مورد نظر'
        required: true
        type: string
      quality:
        description: 'کیفیت مورد نظر'
        required: true
        type: choice
        default: 'best'
        options:
          - 'best'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'
          - 'mp3 (فقط صدا)'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: نصب yt-dlp
        run: pip3 install yt-dlp
      
      - name: دریافت اطلاعات فیلم و دانلود
        run: |
          if [ ! -f "output/extracted_links.json" ]; then
            echo "❌ خطا: فایل output/extracted_links.json پیدا نشد"
            echo "📁 ابتدا فایل اصلی را اجرا کنید"
            exit 1
          fi
          
          VIDEO_URLS=$(cat output/extracted_links.json | jq -r '.pageVideoLinks[]?.url')
          TOTAL=$(echo "$VIDEO_URLS" | wc -l)
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ خطا: هیچ فیلمی پیدا نشد"
            exit 1
          fi
          
          V_NUM="${{ github.event.inputs.video_number }}"
          QUALITY="${{ github.event.inputs.quality }}"
          
          VIDEO_URL=$(echo "$VIDEO_URLS" | sed -n "${V_NUM}p")
          VIDEO_TITLE=$(cat output/extracted_links.json | jq -r ".pageVideoLinks[$((V_NUM-1))].title")
          
          if [ -z "$VIDEO_URL" ]; then
            echo "❌ خطا: شماره فیلم نامعتبر است"
            echo "📋 تعداد کل فیلم‌ها: $TOTAL"
            echo "🔢 شماره‌های مجاز: 1 تا $TOTAL"
            exit 1
          fi
          
          # ساخت پوشه download
          mkdir -p download
          
          echo "═══════════════════════════════════════════════════════════"
          echo "🎬 در حال دانلود فیلم شماره $V_NUM از $TOTAL"
          echo "📌 عنوان: ${VIDEO_TITLE:-بدون عنوان}"
          echo "🔗 لینک: $VIDEO_URL"
          echo "🎚️ کیفیت: $QUALITY"
          echo "📁 ذخیره در: download/"
          echo "═══════════════════════════════════════════════════════════"
          
          cd download
          
          # انتخاب کیفیت
          case "$QUALITY" in
            "best")
              yt-dlp -f best -o "video_${V_NUM}.mp4" "$VIDEO_URL"
              FILE_NAME="video_${V_NUM}.mp4"
              ;;
            "1080p")
              yt-dlp -f "best[height<=1080]" -o "video_${V_NUM}.mp4" "$VIDEO_URL"
              FILE_NAME="video_${V_NUM}.mp4"
              ;;
            "720p")
              yt-dlp -f "best[height<=720]" -o "video_${V_NUM}.mp4" "$VIDEO_URL"
              FILE_NAME="video_${V_NUM}.mp4"
              ;;
            "480p")
              yt-dlp -f "best[height<=480]" -o "video_${V_NUM}.mp4" "$VIDEO_URL"
              FILE_NAME="video_${V_NUM}.mp4"
              ;;
            "360p")
              yt-dlp -f "best[height<=360]" -o "video_${V_NUM}.mp4" "$VIDEO_URL"
              FILE_NAME="video_${V_NUM}.mp4"
              ;;
            "mp3 (فقط صدا)")
              yt-dlp -x --audio-format mp3 -o "audio_${V_NUM}.mp3" "$VIDEO_URL"
              FILE_NAME="audio_${V_NUM}.mp3"
              ;;
          esac
          
          cd ..
          echo "✅ دانلود کامل شد: download/${FILE_NAME}"
      
      - name: ایجاد فایل ZIP
        run: |
          cd download
          ZIP_NAME="downloaded_files_$(date +'%Y%m%d_%H%M%S').zip"
          zip -r "$ZIP_NAME" .
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          cd ..
      
      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # افزودن پوشه download و فایل ZIP
          git add download/
          
          if git diff --staged --quiet; then
            echo "هیچ تغییر جدیدی برای commit وجود ندارد"
          else
            git commit -m "دانلود فیلم شماره ${{ github.event.inputs.video_number }} با کیفیت ${{ github.event.inputs.quality }}"
            git push
            echo "✅ فایل در مخزن ذخیره شد"
          fi
      
      - name: آپلود به عنوان Artifact (پشتیبان)
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-files
          path: download/