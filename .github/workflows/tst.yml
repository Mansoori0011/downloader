name: 🌐 دانلود کامل صفحه با wget

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: دانلود صفحه با wget
        run: |
          URL="${{ github.event.inputs.url }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          OUTPUT_DIR="page_${TIMESTAMP}"
          
          echo "در حال دانلود صفحه: $URL"
          
          # دانلود کامل صفحه با تمام منابع
          wget \
            --recursive \
            --page-requisites \
            --adjust-extension \
            --span-hosts \
            --convert-links \
            --restrict-file-names=windows \
            --directory-prefix="$OUTPUT_DIR" \
            --no-parent \
            "$URL"
          
          # ایجاد فایل ZIP
          cd "$OUTPUT_DIR"
          zip -r "../${OUTPUT_DIR}.zip" .
          cd ..
          
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ دانلود کامل شد!"
          echo "📁 پوشه: $OUTPUT_DIR"
          echo "📦 فایل ZIP: ${OUTPUT_DIR}.zip"
          echo "═══════════════════════════════════════════════════════════"

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add page_*/
          git add *.zip
          git commit -m "دانلود صفحه ${{ github.event.inputs.url }}" || echo "تغییری وجود ندارد"
          git push origin master

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-page
          path: |
            page_*/
            *.zip