name: دانلود صفحه فیلم با قابلیت استخراج لینک

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس صفحه دارای فیلم'
        required: true
        type: string

jobs:
  download-page:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          npm install -g puppeteer
          npm install puppeteer

      - name: دانلود صفحه و استخراج لینک فیلم‌ها
        run: |
          URL="${{ github.event.inputs.url }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          OUTPUT_DIR="movies_${TIMESTAMP}"
          mkdir -p "$OUTPUT_DIR"
          
          cat > extract.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          
          (async () => {
            const url = process.argv[2];
            const outputHtml = process.argv[3];
            const outputJson = process.argv[4];
            
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
            
            console.log('در حال بارگذاری:', url);
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
            
            // استخراج فیلم‌ها و لینک‌ها
            const movies = await page.evaluate(() => {
              const results = [];
              
              // جستجو در لینک‌ها
              const links = document.querySelectorAll('a');
              links.forEach(link => {
                const href = link.href;
                const title = link.innerText?.trim() || link.title || '';
                
                if (href && (
                  href.includes('/video/') || 
                  href.includes('/watch') || 
                  href.includes('/v/') ||
                  href.includes('/view_video.php') ||
                  href.includes('.mp4')
                )) {
                  results.push({
                    title: title.substring(0, 100),
                    url: href
                  });
                }
              });
              
              // جستجو در المنت‌های ویدیویی
              const videos = document.querySelectorAll('video, iframe');
              videos.forEach(video => {
                const src = video.src || video.getAttribute('data-src');
                if (src) {
                  results.push({
                    title: 'Video Player',
                    url: src
                  });
                }
              });
              
              return results;
            });
            
            // دریافت HTML صفحه
            const html = await page.content();
            
            // ساخت صفحه آفلاین با قابلیت کلیک طولانی
            const offlinePage = `<!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>Movies List - ${url}</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
                    .container { max-width: 800px; margin: auto; }
                    h1 { text-align: center; margin-bottom: 20px; color: #ff6b6b; }
                    .info { background: #16213e; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
                    .info p { margin: 5px 0; color: #ccc; }
                    .movie-list { display: flex; flex-direction: column; gap: 10px; }
                    .movie-item {
                        background: #0f3460;
                        padding: 15px;
                        border-radius: 10px;
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        transition: all 0.3s;
                        cursor: pointer;
                    }
                    .movie-item:hover { background: #1a4a7a; transform: translateX(5px); }
                    .movie-title { font-size: 16px; color: #fff; word-break: break-word; flex: 1; }
                    .movie-link { font-size: 12px; color: #aaa; margin-left: 10px; }
                    .copy-btn {
                        background: #ff6b6b;
                        color: white;
                        border: none;
                        padding: 8px 15px;
                        border-radius: 5px;
                        cursor: pointer;
                        font-size: 12px;
                        margin-left: 10px;
                    }
                    .copy-btn:hover { background: #ff4757; }
                    .toast {
                        position: fixed;
                        bottom: 20px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: #4cd964;
                        color: white;
                        padding: 10px 20px;
                        border-radius: 8px;
                        display: none;
                        z-index: 1000;
                    }
                    .footer { text-align: center; margin-top: 30px; padding: 20px; color: #666; font-size: 12px; }
                    .instructions { background: #16213e; padding: 15px; border-radius: 10px; margin-top: 20px; }
                    .instructions h3 { margin-bottom: 10px; color: #ff6b6b; }
                    .instructions p { margin: 5px 0; font-size: 14px; }
                </style>
            </head>
            <body>
                <div class="container">
                    <h1>🎬 Movie Links Extractor</h1>
                    
                    <div class="info">
                        <p><strong>📌 منبع:</strong> ${url}</p>
                        <p><strong>📅 تاریخ استخراج:</strong> ${new Date().toLocaleString()}</p>
                        <p><strong>🎥 تعداد فیلم‌ها:</strong> ${movies.length}</p>
                    </div>
                    
                    <div class="movie-list">
                        ${movies.map((movie, i) => `
                            <div class="movie-item" data-url="${movie.url.replace(/"/g, '&quot;')}" data-title="${movie.title.replace(/"/g, '&quot;')}">
                                <div class="movie-title" title="کلیک طولانی برای کپی لینک">
                                    ${i+1}. ${movie.title || 'بدون عنوان'}
                                </div>
                                <div class="movie-link">🔗</div>
                                <button class="copy-btn" data-url="${movie.url.replace(/"/g, '&quot;')}">📋 کپی لینک</button>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="instructions">
                        <h3>📖 نحوه استخراج لینک:</h3>
                        <p>1️⃣ برای کپی لینک فیلم، روی دکمه <strong>"📋 کپی لینک"</strong> کلیک کنید.</p>
                        <p>2️⃣ همچنین می‌توانید روی هر فیلم <strong>کلیک طولانی (نگه دارید)</strong> کنید تا لینک کپی شود.</p>
                        <p>3️⃣ لینک کپی شده را در دانلود منیجر یا IDM قرار دهید.</p>
                    </div>
                    
                    <div class="footer">
                        ✨ با استفاده از GitHub Actions | لیست فیلم‌ها به صورت خودکار استخراج شده است
                    </div>
                </div>
                
                <div id="toast" class="toast">✅ لینک کپی شد!</div>
                
                <script>
                    function showToast() {
                        const toast = document.getElementById('toast');
                        toast.style.display = 'block';
                        setTimeout(() => { toast.style.display = 'none'; }, 1500);
                    }
                    
                    function copyToClipboard(text) {
                        navigator.clipboard.writeText(text).then(() => showToast());
                    }
                    
                    // کلیک روی دکمه کپی
                    document.querySelectorAll('.copy-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const url = btn.getAttribute('data-url');
                            copyToClipboard(url);
                        });
                    });
                    
                    // کلیک طولانی روی هر آیتم فیلم
                    document.querySelectorAll('.movie-item').forEach(item => {
                        let pressTimer;
                        
                        item.addEventListener('mousedown', () => {
                            pressTimer = setTimeout(() => {
                                const url = item.getAttribute('data-url');
                                copyToClipboard(url);
                            }, 500);
                        });
                        
                        item.addEventListener('mouseup', () => clearTimeout(pressTimer));
                        item.addEventListener('mouseleave', () => clearTimeout(pressTimer));
                        
                        // برای دستگاه‌های لمسی (گوشی)
                        item.addEventListener('touchstart', (e) => {
                            pressTimer = setTimeout(() => {
                                const url = item.getAttribute('data-url');
                                copyToClipboard(url);
                            }, 500);
                        });
                        item.addEventListener('touchend', () => clearTimeout(pressTimer));
                    });
                </script>
            </body>
            </html>`;
            
            fs.writeFileSync(outputHtml, offlinePage);
            fs.writeFileSync(outputJson, JSON.stringify(movies, null, 2));
            
            console.log(`✅ ${movies.length} فیلم استخراج شد`);
            await browser.close();
          })();
          EOF
          
          node extract.js "$URL" "$OUTPUT_DIR/index.html" "$OUTPUT_DIR/movies.json"
          
          # ایجاد فایل README
          cat > "$OUTPUT_DIR/README.md" << EOL
          # 🎬 لیست فیلم‌های استخراج شده
          
          - **منبع**: $URL
          - **تاریخ**: $(date)
          - **تعداد فیلم‌ها**: $(cat "$OUTPUT_DIR/movies.json" | jq '. | length')
          
          ## نحوه استفاده
          
          1. فایل \`index.html\` را در مرورگر باز کنید
          2. روی **"📋 کپی لینک"** کلیک کنید یا روی اسم فیلم **کلیک طولانی** کنید
          3. لینک کپی شده را در دانلود منیجر (IDM, yt-dlp) قرار دهید
          
          ## فایل‌ها
          - \`index.html\` - صفحه قابل مشاهده در مرورگر
          - \`movies.json\` - لیست کامل فیلم‌ها با JSON
          EOL
          
          # ایجاد ZIP
          cd "$OUTPUT_DIR"
          zip -r "../${OUTPUT_DIR}.zip" .
          cd ..
          
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          echo ""

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ${{ env.OUTPUT_DIR }}/
          git commit -m "دانلود صفحه فیلم‌ها از ${{ github.event.inputs.url }}" || echo "تغییری وجود ندارد"
          git push origin master

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: movies-page
          path: ${{ env.OUTPUT_DIR }}/

      - name: نمایش نتایج
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ صفحه فیلم‌ها با موفقیت ساخته شد!"
          echo "═══════════════════════════════════════════════════════════"
          echo "📁 پوشه: ${{ env.OUTPUT_DIR }}"
          echo "📄 فایل اصلی: index.html"
          echo "🎬 تعداد فیلم‌ها: $(cat ${{ env.OUTPUT_DIR }}/movies.json | jq '. | length')"
          echo ""
          echo "📥 برای استفاده:"
          echo "   1. فایل index.html را در مرورگر باز کنید"
          echo "   2. روی اسم فیلم کلیک طولانی کنید یا دکمه کپی را بزنید"
          echo "═══════════════════════════════════════════════════════════"