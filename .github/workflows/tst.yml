name: استخراج لینک فیلم‌ها (view_video.php)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس صفحه یا دسته‌بندی سایت'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          npm init -y
          npm install puppeteer

      - name: استخراج لینک‌ها و اسکرین‌شات
        run: |
          URL="${{ github.event.inputs.url }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          OUTPUT_DIR="extracted_${TIMESTAMP}"
          mkdir -p "$OUTPUT_DIR/screenshots"
          
          cat > extract.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          
          (async () => {
            const url = process.argv[2];
            const outputJson = process.argv[3];
            const screenshotPath = process.argv[4];
            
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
            
            console.log('در حال بارگذاری:', url);
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
            
            // اسکرول صفحه
            for (let i = 0; i < 5; i++) {
              await page.evaluate(() => window.scrollBy(0, window.innerHeight));
              await new Promise(r => setTimeout(r, 1000));
            }
            
            // اسکرین‌شات
            await page.screenshot({ path: screenshotPath, fullPage: true });
            console.log('اسکرین‌شات گرفته شد');
            
            // استخراج لینک‌های view_video.php
            const videoLinks = await page.evaluate(() => {
              const links = [];
              document.querySelectorAll('a').forEach(a => {
                const href = a.href;
                if (href && href.includes('/view_video.php?viewkey=')) {
                  links.push({
                    url: href,
                    title: a.innerText?.trim() || a.title || 'بدون عنوان'
                  });
                }
              });
              return links;
            });
            
            fs.writeFileSync(outputJson, JSON.stringify(videoLinks, null, 2));
            console.log(`✅ ${videoLinks.length} لینک فیلم استخراج شد`);
            
            await browser.close();
          })();
          EOF
          
          node extract.js "$URL" "$OUTPUT_DIR/video_links.json" "$OUTPUT_DIR/screenshots/fullpage.png"
          
          # ایجاد فایل متنی ساده
          echo "═══════════════════════════════════════════════════════════" > "$OUTPUT_DIR/video_links.txt"
          echo "لیست لینک‌های فیلم" >> "$OUTPUT_DIR/video_links.txt"
          echo "منبع: $URL" >> "$OUTPUT_DIR/video_links.txt"
          echo "تاریخ: $(date)" >> "$OUTPUT_DIR/video_links.txt"
          echo "═══════════════════════════════════════════════════════════" >> "$OUTPUT_DIR/video_links.txt"
          echo "" >> "$OUTPUT_DIR/video_links.txt"
          
          cat "$OUTPUT_DIR/video_links.json" | jq -r '.[] | "عنوان: " + .title + "\nلینک: " + .url + "\n---"' >> "$OUTPUT_DIR/video_links.txt"
          
          # ایجاد README
          VIDEO_COUNT=$(cat "$OUTPUT_DIR/video_links.json" | jq '. | length')
          cat > "$OUTPUT_DIR/README.md" << EOL
          # نتایج استخراج لینک فیلم
  
          - **آدرس**: $URL
          - **تاریخ**: $(date)
          - **تعداد فیلم‌ها**: $VIDEO_COUNT
  
          ## اسکرین‌شات
          ![اسکرین‌شات](./screenshots/fullpage.png)
  
          ## لینک‌های فیلم
          [video_links.txt](./video_links.txt)
          EOL
          
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ env.OUTPUT_DIR }}/"
          git commit -m "استخراج لینک فیلم‌ها از ${{ github.event.inputs.url }}" || echo "تغییری وجود ندارد"
          git push

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-links
          path: ${{ env.OUTPUT_DIR }}/

      - name: نمایش نتایج
        run: |
          VIDEO_COUNT=$(cat "${{ env.OUTPUT_DIR }}/video_links.json" | jq '. | length')
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ استخراج با موفقیت انجام شد!"
          echo "═══════════════════════════════════════════════════════════"
          echo "📁 پوشه: ${{ env.OUTPUT_DIR }}"
          echo "🎬 تعداد لینک‌ها: $VIDEO_COUNT"
          echo "📸 اسکرین‌شات: ${{ env.OUTPUT_DIR }}/screenshots/fullpage.png"
          echo "═══════════════════════════════════════════════════════════"