name: دانلود فیلم با Puppeteer (Network Monitor)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک فیلم'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget
          npm init -y
          npm install puppeteer

      - name: استخراج لینک و دانلود
        run: |
          URL="${{ github.event.inputs.url }}"
          
          cat > extract.js << 'EOF'
          const puppeteer = require('puppeteer');
          const { exec } = require('child_process');
          const fs = require('fs');
          
          (async () => {
            const url = process.argv[2];
            
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
            
            // جمع‌آوری درخواست‌های شبکه
            const videoUrls = new Set();
            
            page.on('request', request => {
              const reqUrl = request.url();
              // جستجوی لینک‌های ویدیویی
              if (reqUrl.match(/\.(mp4|m3u8|ts|flv)(\?|$)/i) ||
                  reqUrl.includes('/video/') ||
                  reqUrl.includes('/get_file/') ||
                  reqUrl.includes('/hls/')) {
                videoUrls.add(reqUrl);
                console.log('🎬 لینک پیدا شد:', reqUrl.substring(0, 150));
              }
            });
            
            console.log('در حال بارگذاری:', url);
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
            
            // اسکرول و انتظار برای لود ویدیو
            console.log('اسکرول صفحه...');
            for (let i = 0; i < 3; i++) {
              await page.evaluate(() => window.scrollBy(0, window.innerHeight));
              await new Promise(r => setTimeout(r, 2000));
            }
            
            // کلیک روی دکمه پخش (اگر لازم باشد)
            await page.evaluate(() => {
              const playBtn = document.querySelector('button[class*="play"], div[class*="play"]');
              if (playBtn) playBtn.click();
            });
            
            await new Promise(r => setTimeout(r, 5000));
            
            await browser.close();
            
            if (videoUrls.size > 0) {
              const videoUrl = Array.from(videoUrls)[0];
              console.log('✅ لینک مستقیم:', videoUrl);
              
              // دانلود
              exec(`wget --user-agent="Mozilla/5.0" -O video.mp4 "${videoUrl}"`, (error) => {
                if (error) console.error('خطا:', error);
                else console.log('✅ دانلود شد');
              });
            } else {
              console.log('❌ هیچ لینک ویدیویی پیدا نشد');
            }
          })();
          EOF
          
          node extract.js "$URL"
          sleep 10

      - name: آپلود فایل
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: video.mp4