name: دانلود فیلم با انتخاب کیفیت

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک صفحه فیلم (view_video.php?viewkey=...)'
        required: true
        type: string
      quality:
        description: 'کیفیت مورد نظر'
        required: true
        type: choice
        default: 'best'
        options:
          - 'best'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: نصب yt-dlp
        run: |
          pip install yt-dlp

      - name: دانلود فیلم و ساخت ZIP
        run: |
          URL="${{ github.event.inputs.video_url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          
          echo "═══════════════════════════════════════════════════════════"
          echo "🎬 در حال دانلود فیلم"
          echo "🔗 لینک: $URL"
          echo "🎚️ کیفیت: $QUALITY"
          echo "═══════════════════════════════════════════════════════════"
          
          # دانلود فیلم
          case "$QUALITY" in
            "best")
              yt-dlp -f best -o "video_${TIMESTAMP}.mp4" "$URL"
              ;;
            "1080p")
              yt-dlp -f "best[height<=1080]" -o "video_${TIMESTAMP}.mp4" "$URL"
              ;;
            "720p")
              yt-dlp -f "best[height<=720]" -o "video_${TIMESTAMP}.mp4" "$URL"
              ;;
            "480p")
              yt-dlp -f "best[height<=480]" -o "video_${TIMESTAMP}.mp4" "$URL"
              ;;
            "360p")
              yt-dlp -f "best[height<=360]" -o "video_${TIMESTAMP}.mp4" "$URL"
              ;;
          esac
          
          # ساخت فایل ZIP
          zip "video_${TIMESTAMP}.zip" "video_${TIMESTAMP}.mp4"
          echo "✅ فایل ZIP ساخته شد: video_${TIMESTAMP}.zip"
          
          # حذف فایل MP4 (فقط ZIP بماند)
          rm "video_${TIMESTAMP}.mp4"
          
          echo "FILE_ZIP=video_${TIMESTAMP}.zip" >> $GITHUB_ENV

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ env.FILE_ZIP }}"
          git commit -m "دانلود فیلم با کیفیت ${{ github.event.inputs.quality }}" || echo "تغییری وجود ندارد"
          git push origin master

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: ${{ env.FILE_ZIP }}