name: Download APK and Commit

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download APK
        run: |
          curl -L -o app-debug.apk "https://github.com/thecybersandeep/Frida-Launcher/releases/download/v2/app-debug.apk"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app-debug.apk
          git commit -m "Add Frida Launcher APK" || echo "No changes"
          git push
