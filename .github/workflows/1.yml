name: استخراج لینک ویدیو از سایت

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string
        default: 'https://example.com'

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # اجبار به استفاده از Node.js 24

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v5
      
      - name: نصب ابزارهای مورد نیاز
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install yt-dlp
      
      - name: استخراج لینک ویدیوها
        run: |
          SITE_URL="${{ github.event.inputs.site_url }}"
          DATE_TIME=$(date +'%Y%m%d_%H%M%S')
          FOLDER_NAME="video_links_${DATE_TIME}"
          
          mkdir -p "$FOLDER_NAME"
          
          echo "═══════════════════════════════════════════════════════════"
          echo "در حال استخراج لینک از: $SITE_URL"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          
          OUTPUT_FILE="$FOLDER_NAME/video_links.txt"
          JSON_FILE="$FOLDER_NAME/video_info.json"
          
          echo "═══════════════════════════════════════════════════════════" > "$OUTPUT_FILE"
          echo "لینک‌های ویدیویی استخراج شده" >> "$OUTPUT_FILE"
          echo "آدرس سایت: $SITE_URL" >> "$OUTPUT_FILE"
          echo "تاریخ: $(date)" >> "$OUTPUT_FILE"
          echo "═══════════════════════════════════════════════════════════" >> "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          
          # روش 1: استفاده از yt-dlp
          echo "✅ در حال استخراج با yt-dlp..." >> "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          
          BEST_URL=$(yt-dlp -f best -g "$SITE_URL" 2>/dev/null | head -1)
          if [ -n "$BEST_URL" ]; then
            echo "🎬 لینک مستقیم (بهترین کیفیت):" >> "$OUTPUT_FILE"
            echo "$BEST_URL" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
            echo "$BEST_URL" > "$FOLDER_NAME/direct_link.txt"
          fi
          
          TITLE=$(yt-dlp --get-title "$SITE_URL" 2>/dev/null)
          if [ -n "$TITLE" ]; then
            echo "📌 عنوان ویدیو: $TITLE" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
          fi
          
          echo "📥 همه لینک‌های قابل دانلود:" >> "$OUTPUT_FILE"
          yt-dlp -g "$SITE_URL" 2>/dev/null >> "$OUTPUT_FILE"
          
          yt-dlp --dump-json "$SITE_URL" 2>/dev/null > "$JSON_FILE"
          
          # روش 2: اگر yt-dlp جواب نداد
          if [ ! -s "$FOLDER_NAME/direct_link.txt" ]; then
            echo "" >> "$OUTPUT_FILE"
            echo "⚠️ yt-dlp موفق نبود، تلاش با روش جایگزین..." >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
            echo "🔍 روش جایگزین (جستجو در صفحه):" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
            
            curl -s -L "$SITE_URL" -o "$FOLDER_NAME/page.html"
            
            grep -oE 'https?://[^"'"'"'<>]+\.(mp4|m3u8|mkv|avi|mov|flv|webm|ts)[^"'"'"'<>]*' "$FOLDER_NAME/page.html" | sort -u >> "$OUTPUT_FILE"
          fi
          
          echo "" >> "$OUTPUT_FILE"
          echo "═══════════════════════════════════════════════════════════" >> "$OUTPUT_FILE"
          echo "پایان" >> "$OUTPUT_FILE"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ نتیجه استخراج:"
          echo "═══════════════════════════════════════════════════════════"
          cat "$OUTPUT_FILE"
          
          echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
      
      - name: ذخیره در مخزن گیت‌هاب
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ env.FOLDER_NAME }}/"
          git commit -m "استخراج لینک ویدیو از ${{ github.event.inputs.site_url }}" || echo "تغییری وجود ندارد"
          git push || echo "خطا در ارسال"
      
      - name: آپلود به عنوان Artifact
        uses: actions/upload-artifact@v5
        with:
          name: video-links-${{ github.run_id }}
          path: ${{ env.FOLDER_NAME }}/
      
      - name: نمایش لینک دسترسی
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ فایل‌ها با موفقیت ذخیره شدند!"
          echo "📁 پوشه: ${{ env.FOLDER_NAME }}"
          echo "🔗 لینک: https://github.com/${{ github.repository }}/tree/main/${{ env.FOLDER_NAME }}"
          echo "═══════════════════════════════════════════════════════════"
