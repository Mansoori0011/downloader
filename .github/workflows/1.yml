name: 🌐 Extract Video Links from Website

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string

jobs:
  extract-videos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install yt-dlp and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install yt-dlp
      
      - name: Extract video links with yt-dlp
        run: |
          URL="${{ github.event.inputs.url }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FOLDER_NAME="extracted_${TIMESTAMP}"
          
          # ساخت پوشه اصلی
          mkdir -p "$FOLDER_NAME/links"
          mkdir -p "$FOLDER_NAME/videos"
          
          echo "در حال استخراج از: $URL"
          echo ""
          
          # روش 1: دریافت لینک‌های مستقیم
          echo "═══════════════════════════════════════════════════════════" | tee "$FOLDER_NAME/links/video-links.txt"
          echo "لینک‌های ویدیویی استخراج شده" | tee -a "$FOLDER_NAME/links/video-links.txt"
          echo "آدرس: $URL" | tee -a "$FOLDER_NAME/links/video-links.txt"
          echo "تاریخ: $(date)" | tee -a "$FOLDER_NAME/links/video-links.txt"
          echo "═══════════════════════════════════════════════════════════" | tee -a "$FOLDER_NAME/links/video-links.txt"
          echo "" | tee -a "$FOLDER_NAME/links/video-links.txt"
          
          # دریافت اطلاعات ویدیوها
          echo "در حال دریافت اطلاعات..."
          
          # دریافت لینک‌های مستقیم (بهترین کیفیت)
          yt-dlp -f best -g "$URL" 2>/dev/null > "$FOLDER_NAME/videos/direct-urls.txt" || echo "امکان استخراج لینک مستقیم نیست" > "$FOLDER_NAME/videos/direct-urls.txt"
          
          # دریافت لینک‌های ویدیوها با عنوان
          yt-dlp --get-url --get-title "$URL" 2>/dev/null | paste - - > "$FOLDER_NAME/links/all-links.txt"
          
          # دریافت اطلاعات کامل JSON
          yt-dlp --dump-json --flat-playlist "$URL" 2>/dev/null > "$FOLDER_NAME/links/video-info.json" || echo "[]" > "$FOLDER_NAME/links/video-info.json"
          
          # ایجاد خروجی خواندنی
          if [ -s "$FOLDER_NAME/links/all-links.txt" ]; then
            cat "$FOLDER_NAME/links/all-links.txt" | while IFS= read -r line; do
              title=$(echo "$line" | cut -f1)
              url=$(echo "$line" | cut -f2)
              echo "عنوان: $title" >> "$FOLDER_NAME/links/video-links.txt"
              echo "لینک: $url" >> "$FOLDER_NAME/links/video-links.txt"
              echo "---" >> "$FOLDER_NAME/links/video-links.txt"
            done
          else
            echo "ویدیویی پیدا نشد" >> "$FOLDER_NAME/links/video-links.txt"
          fi
          
          # ایجاد README
          cat > "$FOLDER_NAME/README.md" << EOL
# نتایج استخراج ویدیو

- **آدرس سایت**: $URL
- **تاریخ**: $(date)
- **تعداد ویدیوها**: $(grep -c "عنوان:" "$FOLDER_NAME/links/video-links.txt" 2>/dev/null || echo "0")

## محتویات پوشه

| فایل | توضیح |
|------|-------|
| \`links/video-links.txt\` | لیست کامل لینک‌ها و عناوین |
| \`links/video-info.json\` | اطلاعات کامل به صورت JSON |
| \`links/all-links.txt\` | لینک‌ها و عناوین خام |
| \`videos/direct-urls.txt\` | لینک‌های مستقیم برای دانلود |

---
تولید شده توسط GitHub Actions
EOL
          
          # نمایش نتیجه
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "نتایج استخراج:"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          cat "$FOLDER_NAME/links/video-links.txt"
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "تعداد ویدیوهای پیدا شده: $(grep -c "عنوان:" "$FOLDER_NAME/links/video-links.txt" 2>/dev/null || echo "0")"
          echo "═══════════════════════════════════════════════════════════"
          
          echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
      
      - name: Commit and push to repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ env.FOLDER_NAME }}/"
          git commit -m "Extract video links from ${{ github.event.inputs.url }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
      
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-video-links
          path: ${{ env.FOLDER_NAME }}/
      
      - name: Show folder location
        run: |
          echo ""
          echo "========================================"
          echo "✅ فایل‌ها با موفقیت ذخیره شدند!"
          echo "📁 پوشه: ${{ env.FOLDER_NAME }}"
          echo "🔗 لینک: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/${{ env.FOLDER_NAME }}"
          echo "========================================"
