name: 🌐 Extract Video Links from Website

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string
        default: 'https://www.example.com/view_video.php?viewkey=xxxxx'

jobs:
  extract-videos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install yt-dlp and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg
          pip3 install --upgrade yt-dlp
      
      - name: Extract video information
        run: |
          URL="${{ github.event.inputs.url }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FOLDER_NAME="extracted_${TIMESTAMP}"
          
          mkdir -p "$FOLDER_NAME/links"
          mkdir -p "$FOLDER_NAME/videos"
          
          echo "در حال استخراج اطلاعات از: $URL"
          echo ""
          
          # ذخیره اطلاعات کامل به صورت JSON
          yt-dlp --dump-json "$URL" > "$FOLDER_NAME/links/video-info.json" 2>/dev/null || echo "{}" > "$FOLDER_NAME/links/video-info.json"
          
          # استخراج لینک مستقیم ویدیو (بهترین کیفیت)
          echo "═══════════════════════════════════════════════════════════" > "$FOLDER_NAME/links/video-links.txt"
          echo "لینک‌های ویدیویی استخراج شده" >> "$FOLDER_NAME/links/video-links.txt"
          echo "آدرس: $URL" >> "$FOLDER_NAME/links/video-links.txt"
          echo "تاریخ: $(date)" >> "$FOLDER_NAME/links/video-links.txt"
          echo "═══════════════════════════════════════════════════════════" >> "$FOLDER_NAME/links/video-links.txt"
          echo "" >> "$FOLDER_NAME/links/video-links.txt"
          
          # دریافت عنوان ویدیو
          TITLE=$(yt-dlp --get-title "$URL" 2>/dev/null || echo "عنوان نامشخص")
          echo "عنوان ویدیو: $TITLE" >> "$FOLDER_NAME/links/video-links.txt"
          echo "" >> "$FOLDER_NAME/links/video-links.txt"
          
          # دریافت لینک‌های مستقیم با کیفیت‌های مختلف
          echo "لینک‌های مستقیم دانلود:" >> "$FOLDER_NAME/links/video-links.txt"
          yt-dlp -f best -g "$URL" 2>/dev/null > "$FOLDER_NAME/videos/best-quality-url.txt"
          
          # دریافت همه لینک‌های قابل دانلود
          yt-dlp -g "$URL" 2>/dev/null > "$FOLDER_NAME/videos/all-urls.txt"
          
          if [ -s "$FOLDER_NAME/videos/best-quality-url.txt" ]; then
            echo "بهترین کیفیت: $(cat "$FOLDER_NAME/videos/best-quality-url.txt")" >> "$FOLDER_NAME/links/video-links.txt"
          else
            echo "امکان استخراج لینک مستقیم وجود ندارد" >> "$FOLDER_NAME/links/video-links.txt"
          fi
          
          echo "" >> "$FOLDER_NAME/links/video-links.txt"
          echo "═══════════════════════════════════════════════════════════" >> "$FOLDER_NAME/links/video-links.txt"
          echo "فرمت‌های موجود برای دانلود:" >> "$FOLDER_NAME/links/video-links.txt"
          yt-dlp -F "$URL" 2>/dev/null >> "$FOLDER_NAME/links/video-links.txt"
          
          # ایجاد README
          cat > "$FOLDER_NAME/README.md" << EOL
# نتایج استخراج ویدیو

- **آدرس سایت**: $URL
- **عنوان ویدیو**: $TITLE
- **تاریخ**: $(date)

## محتویات پوشه

| فایل | توضیح |
|------|-------|
| \`links/video-info.json\` | اطلاعات کامل ویدیو به صورت JSON |
| \`links/video-links.txt\` | لینک‌های مستقیم و فرمت‌های موجود |
| \`videos/best-quality-url.txt\` | لینک مستقیم بهترین کیفیت |
| \`videos/all-urls.txt\` | همه لینک‌های قابل دانلود |

## نحوه دانلود

برای دانلود ویدیو می‌توانید از دستور زیر استفاده کنید:

\`\`\`bash
yt-dlp -f best "$URL"
\`\`\`

---
تولید شده توسط GitHub Actions
EOL
          
          # نمایش نتیجه
          echo ""
          cat "$FOLDER_NAME/links/video-links.txt"
          echo ""
          
          echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
      
      - name: Commit and push to repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ env.FOLDER_NAME }}/"
          git commit -m "Extract video info from ${{ github.event.inputs.url }}" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
      
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-video-info
          path: ${{ env.FOLDER_NAME }}/
      
      - name: Show folder location
        run: |
          echo ""
          echo "========================================"
          echo "✅ اطلاعات با موفقیت ذخیره شد!"
          echo "📁 پوشه: ${{ env.FOLDER_NAME }}"
          echo "🔗 لینک: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/${{ env.FOLDER_NAME }}"
          echo "========================================"
