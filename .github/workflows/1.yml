name: 🌐 Extract Video Links with yt-dlp

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس صفحه یا لیست پخش'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install yt-dlp
      
      - name: Extract video info
        run: |
          URL="${{ github.event.inputs.url }}"
          echo "در حال استخراج اطلاعات از: $URL"
          
          # دریافت لینک‌های ویدیو
          yt-dlp --get-url "$URL" 2>/dev/null | tee direct-urls.txt
          
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "اطلاعات کامل ویدیوها:"
          echo "═══════════════════════════════════════════════════════════"
          yt-dlp --dump-json --flat-playlist "$URL" 2>/dev/null | jq -r '.title + " | " + .url' > video-list.txt
          cat video-list.txt
          
          # ذخیره لینک‌های مستقیم دانلود (بهترین کیفیت)
          yt-dlp -f best -g "$URL" 2>/dev/null | tee best-quality-urls.txt
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: video-info
          path: |
            direct-urls.txt
            best-quality-urls.txt
            video-list.txt
