name: Extract Video Link (PornTube Style)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو (مثلاً .../view_video.php?viewkey=xxxxx)'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install yt-dlp

      - name: Extract Direct Links
        run: |
          URL="${{ github.event.inputs.url }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FOLDER="video_links/${TIMESTAMP}"
          mkdir -p "$FOLDER"

          echo "Extracting info from: $URL"

          # دریافت عنوان ویدیو
          TITLE=$(yt-dlp --get-title "$URL" 2>/dev/null || echo "Unknown Title")
          echo "Title: $TITLE"

          # دریافت لینک مستقیم بهترین کیفیت
          BEST_URL=$(yt-dlp -f best -g "$URL" 2>/dev/null)
          if [ -n "$BEST_URL" ]; then
            echo "Direct Link (Best Quality): $BEST_URL"
            echo "$BEST_URL" > "$FOLDER/direct_link.txt"
          else
            echo "Failed to extract direct link."
            echo "Extraction Failed" > "$FOLDER/direct_link.txt"
          fi

          # ذخیره لاگ اطلاعات
          {
            echo "# Extraction Result"
            echo "**URL:** $URL"
            echo "**Date:** $(date)"
            echo "**Title:** $TITLE"
            echo "## Direct Download Link"
            echo "\`$BEST_URL\`"
          } > "$FOLDER/README.md"

          echo "FOLDER_PATH=$FOLDER" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ env.FOLDER_PATH }}"
          git commit -m "Extract video link from ${{ github.event.inputs.url }}" || echo "No changes"
          git push || echo "Push failed"
