name: Download Page as MHTML

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس صفحه سایت'
        required: true
        default: 'https://example.com'
      filename:
        description: 'نام فایل خروجی (بدون پسوند)'
        required: true
        default: 'offline-page'
      target_folder:
        description: 'نام پوشه برای ذخیره'
        required: true
        default: 'saved-pages'

jobs:
  download-mhtml:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Chrome
        run: |
          sudo apt-get update
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version
      
      - name: Install Puppeteer
        run: |
          npm init -y
          PUPPETEER_SKIP_DOWNLOAD=true npm install puppeteer
          echo "CHROME_PATH=$(which google-chrome)" >> $GITHUB_ENV
      
      - name: Download page as MHTML
        run: |
          mkdir -p ${{ github.event.inputs.target_folder }}
          
          cat > download-mhtml.js << 'SCRIPT'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          
          (async () => {
            const url = process.env.PAGE_URL;
            const filename = process.env.FILENAME;
            const folder = process.env.TARGET_FOLDER;
            
            console.log(`🌐 دانلود MHTML از: ${url}`);
            
            const browser = await puppeteer.launch({
              headless: 'new',
              executablePath: process.env.CHROME_PATH || '/usr/bin/google-chrome',
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu'
              ]
            });
            
            const page = await browser.newPage();
            
            // تنظیم User-Agent موبایل
            await page.setUserAgent('Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36');
            await page.setViewport({
              width: 412,
              height: 915,
              deviceScaleFactor: 2
            });
            
            try {
              // بارگذاری صفحه
              console.log('⏳ بارگذاری صفحه...');
              await page.goto(url, {
                waitUntil: 'networkidle0',
                timeout: 60000
              });
              
              console.log('✅ صفحه بارگذاری شد');
              
              // صبر برای لود کامل
              await page.evaluate(() => new Promise(resolve => setTimeout(resolve, 3000)));
              
              // گرفتن MHTML با استفاده از CDP (Chrome DevTools Protocol)
              const cdp = await page.createCDPSession();
              const { data } = await cdp.send('Page.captureSnapshot', {
                format: 'mhtml'
              });
              
              // ذخیره فایل MHTML
              const mhtmlPath = `${folder}/${filename}.mhtml`;
              fs.writeFileSync(mhtmlPath, data);
              
              const stats = fs.statSync(mhtmlPath);
              console.log(`💾 فایل MHTML ذخیره شد: ${(stats.size / 1024).toFixed(2)} KB`);
              console.log(`📁 مسیر: ${mhtmlPath}`);
              
              // اطلاعات اضافی
              const title = await page.title();
              console.log(`📰 عنوان: ${title}`);
              
              // نمایش ۲۰ خط اول برای تأیید
              const preview = data.split('\n').slice(0, 5).join('\n');
              console.log(`📄 پیش‌نمایش فایل:\n${preview}...`);
              
            } catch (error) {
              console.error(`❌ خطا: ${error.message}`);
              process.exit(1);
            } finally {
              await browser.close();
              console.log('🏁 مرورگر بسته شد');
            }
          })();
          SCRIPT
          
          # اجرا
          PAGE_URL="${{ github.event.inputs.url }}" \
          FILENAME="${{ github.event.inputs.filename }}" \
          TARGET_FOLDER="${{ github.event.inputs.target_folder }}" \
          node download-mhtml.js
      
      - name: Check file and create info
        run: |
          MHTML_FILE="${{ github.event.inputs.target_folder }}/${{ github.event.inputs.filename }}.mhtml"
          
          if [ -f "$MHTML_FILE" ]; then
            echo "✅ فایل MHTML با موفقیت ایجاد شد"
            echo "📦 حجم: $(du -h "$MHTML_FILE" | cut -f1)"
            
            # بررسی محتوای MHTML
            head -n 20 "$MHTML_FILE"
          fi
          
          # ایجاد README
          cat > ${{ github.event.inputs.target_folder }}/README.md << EOF
          # 📱 فایل MHTML: ${{ github.event.inputs.filename }}
          
          **آدرس اصلی:** ${{ github.event.inputs.url }}
          **تاریخ:** $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M')
          **فرمت:** MHTML (Web Archive)
          
          ## 📂 فایل:
          - \`${{ github.event.inputs.filename }}.mhtml\` - صفحه کامل آفلاین
          
          ## 📱 نحوه باز کردن روی گوشی:
          
          ### Android:
          1. فایل را با **Chrome** باز کنید
          2. یا از **Google Drive** → Open with Chrome
          
          ### iPhone:
          1. فایل را در **Files** app پیدا کنید
          2. Share → **Save to Files**
          3. با **Safari** باز کنید
          
          ## 🔗 دانلود مستقیم:
          \`\`\`
          https://github.com/${{ github.repository }}/raw/main/${{ github.event.inputs.target_folder }}/${{ github.event.inputs.filename }}.mhtml
          \`\`\`
          
          ## ✨ مزایای MHTML:
          - تمام محتوا در یک فایل
          - پشتیبانی در Chrome و Edge
          - کیفیت دقیقاً مثل صفحه اصلی
          EOF
      
      - name: Commit and push
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git pull origin main || true
          git add ${{ github.event.inputs.target_folder }}/
          git commit -m "📥 Save MHTML: ${{ github.event.inputs.filename }} [${{ github.event.inputs.url }}]" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Show download link
        run: |
          echo "========================================="
          echo "✅ فایل MHTML آماده است!"
          echo "========================================="
          echo ""
          echo "📥 لینک دانلود مستقیم:"
          echo "https://github.com/${{ github.repository }}/raw/main/${{ github.event.inputs.target_folder }}/${{ github.event.inputs.filename }}.mhtml"
          echo ""
          echo "📱 روی گوشی:"
          echo "1. لینک بالا را در Chrome باز کنید"
          echo "2. فایل دانلود می‌شود"
          echo "3. با Chrome باز کنید"
          echo ""
          echo "💾 فرمت: MHTML (Web Archive single file)"