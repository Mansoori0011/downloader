name: دانلود سایت به صورت آفلاین

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl

      - name: دانلود سایت
        run: |
          URL="${{ github.event.inputs.url }}"
          SITE_NAME=$(echo "$URL" | awk -F/ '{print $3}' | sed 's/^www\.//')
          
          rm -rf offline-site
          mkdir -p offline-site
          
          cd offline-site
          
          echo "در حال دانلود: $URL"
          
          wget --user-agent="Mozilla/5.0" \
               --page-requisites \
               --convert-links \
               --adjust-extension \
               --no-parent \
               --wait=2 \
               --limit-rate=200K \
               -r -l 1 "$URL" 2>&1 | tail -10
          
          cd ..
          
          echo "✅ دانلود در پوشه offline-site انجام شد"

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add offline-site/
          git commit -m "دانلود آفلاین از ${{ github.event.inputs.url }}" || echo "تغییری وجود ندارد"
          git push origin master
          
          echo "✅ فایل‌ها در مخزن ذخیره شدند"