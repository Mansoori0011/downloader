name: ذخیره آفلاین وبسایت

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس وبسایت'
        required: true

jobs:
  save-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: دانلود و بسته‌بندی سایت
        run: |
          URL="${{ github.event.inputs.url }}"
          mkdir -p offline-site
          wget --page-requisites --convert-links --adjust-extension --no-parent -P offline-site "$URL"
          cd offline-site && zip -r ../site-backup.zip . && cd ..
      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add offline-site site-backup.zip
          git commit -m "ذخیره آفلاین سایت: $URL" || echo "تغییری وجود ندارد"
          git push