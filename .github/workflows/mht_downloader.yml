name: دانلود سایت به صورت آفلاین

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl

      - name: دانلود سایت
        run: |
          URL="${{ github.event.inputs.url }}"
          SITE_NAME=$(echo "$URL" | awk -F/ '{print $3}' | sed 's/^www\.//')
          
          rm -rf offline-site
          mkdir -p offline-site
          
          cd offline-site
          
          echo "در حال دانلود: $URL"
          
          wget --user-agent="Mozilla/5.0" \
               --page-requisites \
               --convert-links \
               --adjust-extension \
               --no-parent \
               --wait=2 \
               --limit-rate=200K \
               -r -l 1 "$URL" 2>&1 | tail -20
          
          cd ..
          
          echo "✅ دانلود انجام شد"
          echo "فایل‌های موجود در پوشه offline-site:"
          ls -la offline-site/

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # بررسی وجود فایل
          if [ -d "offline-site" ] && [ "$(ls -A offline-site)" ]; then
            echo "✅ پوشه offline-site دارای فایل است"
            git add offline-site/
            git status
            git commit -m "دانلود آفلاین از ${{ github.event.inputs.url }}"
            git push origin master
            echo "✅ فایل‌ها با موفقیت push شدند"
          else
            echo "❌ پوشه offline-site خالی است یا وجود ندارد"
            exit 1
          fi

      - name: آپلود به عنوان Artifact (پشتیبان)
        uses: actions/upload-artifact@v4
        with:
          name: offline-site-backup
          path: offline-site/