name: دانلود کامل صفحه وب

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: نصب wget
        run: sudo apt-get install -y wget

      - name: دانلود کامل صفحه
        run: |
          URL="${{ github.event.inputs.url }}"
          SITE_NAME=$(echo "$URL" | awk -F/ '{print $3}')
          
          rm -rf "offline-$SITE_NAME"
          mkdir -p "offline-$SITE_NAME"
          
          cd "offline-$SITE_NAME"
          
          wget --page-requisites \
               --convert-links \
               --adjust-extension \
               --no-parent \
               --user-agent="Mozilla/5.0" \
               -r -l 1 "$URL"
          
          cd ..
          
          # ایجاد فایل ZIP برای دانلود
          zip -r "site-backup.zip" "offline-$SITE_NAME"
          
          echo "✅ دانلود کامل شد"

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-site
          path: |
            offline-*/
            site-backup.zip