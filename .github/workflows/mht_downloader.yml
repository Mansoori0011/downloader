name: Download as MHT and Update

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string

jobs:
  mht:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب Node.js و SingleFile
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب SingleFile
        run: |
          npm install -g single-file-cli
          npx playwright install chromium

      - name: دانلود به صورت MHT
        run: |
          URL="${{ github.event.inputs.url }}"
          
          # حذف و ساخت مجدد پوشه
          rm -rf web-archive
          mkdir -p web-archive
          
          echo "در حال دانلود: $URL"
          
          # دانلود
          npx single-file "$URL" --output web-archive/archive.mht
          
          # بررسی وجود فایل
          if [ -f "web-archive/archive.mht" ]; then
            echo "✅ فایل MHT با موفقیت ساخته شد"
            ls -la web-archive/
          else
            echo "❌ خطا: فایل MHT ساخته نشد"
            exit 1
          fi

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # اضافه کردن پوشه
          git add web-archive/
          
          # Commit و Push
          git commit -m "بروزرسانی MHT از ${{ github.event.inputs.url }}" || echo "تغییری وجود ندارد"
          git push origin master || echo "خطا در push"
          
          echo "✅ پوشه web-archive در مخزن ذخیره شد"