name: Download Website as MHT Archive

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس سایت مورد نظر (مثال: https://example.com)'
        required: true
        type: string

jobs:
  create-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: نصب ابزارهای مورد نیاز
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          pip install mhtml

      - name: دانلود و ساخت فایل MHT
        run: |
          URL="${{ github.event.inputs.target_url }}"
          
          rm -rf web-archive
          mkdir -p web-archive

          echo "در حال دانلود صفحه: $URL"
          
          # دانلود صفحه با wget
          wget --recursive --page-requisites --convert-links --adjust-extension \
               --no-parent --directory-prefix=web-archive/temp "$URL" 2>/dev/null

          # پیدا کردن فایل HTML اصلی
          MAIN_FILE=$(find web-archive/temp -name "*.html" | head -1)
          
          if [ -f "$MAIN_FILE" ]; then
            # تبدیل به MHT با استفاده از اسکریپت پایتون جداگانه
            cat > convert.py << 'EOF'
import sys
import mhtml

input_file = sys.argv[1]
output_file = sys.argv[2]

with open(input_file, 'rb') as f:
    html_content = f.read()

with open(output_file, 'wb') as f:
    f.write(mhtml.document(html_content).serialize())

print("✅ تبدیل انجام شد")
EOF
            
            python3 convert.py "$MAIN_FILE" web-archive/archive.mht
            echo "✅ فایل MHT در web-archive/archive.mht ذخیره شد"
          else
            echo "❌ خطا: فایل HTML اصلی پیدا نشد"
            exit 1
          fi

          rm -rf web-archive/temp
          rm convert.py

      - name: ارسال به مخزن گیت‌هاب
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add web-archive/
          git commit -m "به‌روزرسانی آرشیو MHT از ${{ github.event.inputs.target_url }}" || echo "تغییری وجود ندارد"
          git push