name: Download as MHT

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت'
        required: true
        type: string

jobs:
  mht:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: نصب SingleFile
        run: |
          npm install -g single-file-cli
          npx playwright install chromium
      
      - name: دانلود به صورت MHT
        run: |
          URL="${{ github.event.inputs.url }}"
          mkdir -p web-archive
          
          single-file "$URL" --browser-chromium-path $(npx playwright where chromium) --output web-archive/archive.mht
          
          echo "✅ فایل MHT در web-archive/archive.mht ذخیره شد"
      
      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add web-archive/
          git commit -m "دانلود MHT از ${{ github.event.inputs.url }}" || echo "تغییری وجود ندارد"
          git push