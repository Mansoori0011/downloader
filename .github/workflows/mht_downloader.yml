name: Download as MHT and Update

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت مورد نظر'
        required: true
        type: string

jobs:
  mht:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب Node.js و SingleFile
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب SingleFile
        run: |
          npm install -g single-file-cli
          npx playwright install chromium

      - name: دانلود به صورت MHT
        run: |
          URL="${{ github.event.inputs.url }}"
          
          # حذف و ساخت مجدد پوشه
          rm -rf web-archive
          mkdir -p web-archive
          
          cd web-archive
          
          echo "در حال دانلود: $URL"
          
          # استفاده از npx بدون --output (مسیر پیش‌فرض)
          npx single-file "$URL" --filename-template="archive"
          
          # پیدا کردن فایل ساخته شده
          FILE=$(ls -t *.html 2>/dev/null | head -1)
          
          if [ -n "$FILE" ]; then
            # تغییر نام به archive.mht
            mv "$FILE" archive.mht
            echo "✅ فایل MHT ساخته شد: web-archive/archive.mht"
            ls -la
          else
            echo "❌ خطا: فایل MHT ساخته نشد"
            exit 1
          fi
          
          cd ..

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add web-archive/
          git commit -m "بروزرسانی MHT از ${{ github.event.inputs.url }}" || echo "تغییری وجود ندارد"
          git push origin master
          
          echo "✅ پوشه web-archive در مخزن ذخیره شد"