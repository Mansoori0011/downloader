name: "روش دوم - با Playwright"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس صفحه'
        required: true

jobs:
  mhtml-with-playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
          
      - name: Save as MHTML with Playwright
        run: |
          node - << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            
            await page.goto('${{ github.event.inputs.site_url }}', { 
              waitUntil: 'networkidle',
              timeout: 60000 
            });
            
            await page.waitForTimeout(10000);
            
            // دریافت MHTML
            const cdpSession = await page.context().newCDPSession(page);
            const { data } = await cdpSession.send('Page.captureSnapshot');
            
            fs.writeFileSync('page_complete.mhtml', data);
            console.log('✅ فایل MHTML ساخته شد');
            
            await browser.close();
          })();
          EOF
          
      - name: Upload
        run: |
          mkdir -p output
          mv page_complete.mhtml output/
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add output/
          git commit -m "MHTML file" || echo "ok"
          git push