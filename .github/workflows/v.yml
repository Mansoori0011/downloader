name: Always-On Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - uses: actions/checkout@v4

    - name: Setup
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq curl wget jq
        npm init -y
        npm install puppeteer

    - name: Start Worker
      run: |
        cat > worker.sh << 'SHEOF'
        #!/bin/bash
        SCRIPT_DIR="$(pwd)"
        GIST_URL="https://api.github.com/gists/9975cf2a918cc9b28d212c28b5ec2cfd"
        LAST_ID=""
        
        while true; do
          COMMAND=$(curl -s "$GIST_URL" | jq -r '.files."command.txt".content // empty' 2>/dev/null)
          COMMAND_ID=$(echo "$COMMAND" | md5sum | cut -d' ' -f1)
          
          if [ -n "$COMMAND" ] && [ "$COMMAND_ID" != "$LAST_ID" ]; then
            echo "=== New command: $COMMAND ==="
            LAST_ID="$COMMAND_ID"
            
            ACTION=$(echo "$COMMAND" | cut -d'|' -f1)
            URL=$(echo "$COMMAND" | cut -d'|' -f2-)
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            case "$ACTION" in
              screenshot)
                node -e "
                  const puppeteer = require('$SCRIPT_DIR/node_modules/puppeteer');
                  (async () => {
                    const b = await puppeteer.launch({headless:'new',args:['--no-sandbox']});
                    const p = await b.newPage();
                    await p.setViewport({width:1280,height:720});
                    await p.goto('$URL', {waitUntil:'networkidle2',timeout:30000});
                    await new Promise(r=>setTimeout(r,2000));
                    await p.screenshot({path:'$SCRIPT_DIR/output.png',fullPage:true});
                    await b.close();
                  })();
                " 2>&1
                RESULT="✅ Screenshot done: $TIMESTAMP"
                ;;
                
              html)
                curl -sL -A "Mozilla/5.0" "$URL" -o "$SCRIPT_DIR/page.html"
                RESULT="✅ HTML saved: $TIMESTAMP ($(wc -c < $SCRIPT_DIR/page.html) bytes)"
                ;;
                
              video)
                sudo apt-get install -y -qq yt-dlp ffmpeg 2>/dev/null
                cd "$SCRIPT_DIR"
                yt-dlp --no-playlist -f "best[height<=720]" -o "video.%(ext)s" "$URL" 2>&1
                RESULT="✅ Video downloaded: $TIMESTAMP"
                ;;
                
              *)
                RESULT="❌ Unknown: $ACTION. Use: screenshot|html|video"
                ;;
            esac
            
            mkdir -p "output/$TIMESTAMP"
            cp "$SCRIPT_DIR/output.png" "output/$TIMESTAMP/" 2>/dev/null || true
            cp "$SCRIPT_DIR/page.html" "output/$TIMESTAMP/" 2>/dev/null || true
            cp "$SCRIPT_DIR/video."* "output/$TIMESTAMP/" 2>/dev/null || true
            
            git config user.name "actions"
            git config user.email "actions@github.com"
            git add output/ 2>/dev/null || true
            git commit -m "$ACTION: $URL ($TIMESTAMP)" 2>/dev/null || true
            git pull --rebase
            git push 2>/dev/null || true
            
            RESULT_JSON=$(echo "$RESULT" | jq -Rs .)
            curl -s -X PATCH \
              -H "Authorization: token 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" \
              -H "Content-Type: application/json" \
              -d "{\"files\":{\"result.txt\":{\"content\":$RESULT_JSON}}}" \
              "$GIST_URL" 2>/dev/null
            
            echo "Result: $RESULT"
          fi
          
          sleep 10
        done
        SHEOF
        
        chmod +x worker.sh
        ./worker.sh
