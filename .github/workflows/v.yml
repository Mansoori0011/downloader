name: "ذخیره صفحه کامل (HTML با همه عکس‌ها، بدون ویدئو)"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس صفحه'
        required: true
        default: 'https://example.com'

jobs:
  save-page:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          
          # نصب SingleFile
          npm install -g single-file-cli

      - name: 💾 Save complete page as single HTML
        run: |
          mkdir -p ./output
          
          # ذخیره صفحه به صورت یک فایل HTML کامل
          single-file "${{ github.event.inputs.site_url }}" --output "./output/page_complete.html"
          
          # اگه SingleFile جواب نداد، از روش جایگزین استفاده کن
          if [ ! -f "./output/page_complete.html" ]; then
            wget --page-requisites --convert-links --adjust-extension -P ./output "${{ github.event.inputs.site_url }}"
          fi

      - name: 🖼️ Extract and embed all images
        run: |
          cd ./output
          
          # پیدا کردن همه عکس‌ها
          find . -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.gif" -o -name "*.webp" -o -name "*.svg" \) | while read img; do
            echo "📸 عکس پیدا شد: $(basename "$img")"
          done
          
          # حذف تگ‌های ویدئو از HTML (اختیاری)
          if [ -f "page_complete.html" ]; then
            sed -i 's/<video[^>]*>.*<\/video>//g' page_complete.html
            sed -i 's/<source[^>]*\.mp4[^>]*>//g' page_complete.html
          fi
          
          cd ..

      - name: 📦 Create single MHTML file
        run: |
          # تبدیل به MHTML با ابزار Chromium
          sudo apt-get install -y chromium-browser
          
          chromium-browser --headless --disable-gpu --dump-dom "${{ github.event.inputs.site_url }}" > ./output/page.html
          
          # ایجاد فایل README
          cat > ./output/README.txt << 'EOF'
          ========================================
          📱 نحوه استفاده در اندروید
          ========================================
          
          فایل page_complete.html رو با هر مرورگری باز کن:
          - Chrome
          - Firefox  
          - Samsung Internet
          
          ✅ همه عکس‌ها نمایش داده می‌شن
          ✅ صفحه دقیقاً شبیه حالت آنلاین هست
          ❌ ویدئوها پخش نمی‌شن (حذف شدن)
          
          TIP: اگه عکس‌ها نشون داده نشد، فایل رو با Notepad باز کن
          و آدرس HTTPS رو به HTTP تغییر بده
          ========================================
          EOF

      - name: 💾 Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add output/
          git diff --staged --quiet || git commit -m "صفحه کامل: ${{ github.event.inputs.site_url }}"
          git push

      - name: ✅ نمایش لینک
        run: |
          echo "=========================================="
          echo "✅ صفحه با موفقیت ذخیره شد"
          echo ""
          echo "📄 فایل HTML کامل:"
          echo "https://github.com/${{ github.repository }}/tree/master/output/page_complete.html"
          echo ""
          echo "📱 برای اندروید:"
          echo "لینک بالا رو توی گوشی باز کن"
          echo "فایل دانلود بشه → با Chrome باز کن"
          echo "=========================================="