name: Get Runner IP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # اجازه اجرای دستی

jobs:
  get_runner_ip:
    runs-on: ubuntu-latest
    outputs:
      runner_ip: ${{ steps.get_ip.outputs.ipv4 }}
    steps:
      - name: دریافت IP عمومی رانر
        id: get_ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "IPv4: $IP"
          echo "ipv4=$IP" >> $GITHUB_OUTPUT

  use_ip_example:
    needs: get_runner_ip
    runs-on: ubuntu-latest
    steps:
      - name: استفاده از IP ذخیره شده
        run: |
          echo "آی پی رانر: ${{ needs.get_runner_ip.outputs.runner_ip }}"
          # مثال: دستور مورد نظرتان با IP
          # curl -H "X-Forwarded-For: ${{ needs.get_runner_ip.outputs.runner_ip }}" https://api.example.com