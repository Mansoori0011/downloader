name: Deploy V2Ray on GitHub Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v2ray:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت IP رانر
        id: get_ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$IP" >> $GITHUB_ENV
          echo "IP: $IP"

      - name: نصب Xray و پیکربندی (بدون systemd)
        run: |
          # نصب Xray
          bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          # ساخت UUID تصادفی
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "XRAY_UUID=$UUID" >> $GITHUB_ENV

          # ساخت فایل کانفیگ
          sudo bash -c "cat > /usr/local/etc/xray/config.json << EOF
          {
            \"inbounds\": [
              {
                \"port\": 8080,
                \"protocol\": \"vless\",
                \"settings\": {
                  \"clients\": [
                    {
                      \"id\": \"$UUID\",
                      \"flow\": \"xtls-rprx-vision\",
                      \"level\": 0
                    }
                  ],
                  \"decryption\": \"none\"
                },
                \"streamSettings\": {
                  \"network\": \"ws\",
                  \"security\": \"none\",
                  \"wsSettings\": {
                    \"path\": \"/ray\"
                  }
                }
              }
            ],
            \"outbounds\": [
              {
                \"protocol\": \"freedom\",
                \"settings\": {}
              }
            ]
          }
          EOF"

          # نصب screen برای اجرا در پس‌زمینه
          sudo apt-get update && sudo apt-get install -y screen

          # اجرای Xray در screen (بدون systemd)
          screen -dmS xray bash -c 'sudo /usr/local/bin/xray run -c /usr/local/etc/xray/config.json'

      - name: تست و اطمینان از اجرا
        run: |
          sleep 3
          if screen -list | grep -q "xray"; then
            echo "✅ Xray با موفقیت اجرا شد"
          else
            echo "❌ خطا در اجرای Xray"
            exit 1
          fi

      - name: ساخت لینک کانفیگ
        run: |
          CONFIG_URL="vless://${{ env.XRAY_UUID }}@${{ env.RUNNER_IP }}:8080?encryption=none&security=none&type=ws&path=%2Fray#GitHubActions-VPN"
          
          echo "✅ کانفیگ V2RayNG (کپی کنید):" > v2ray-config.txt
          echo "$CONFIG_URL" >> v2ray-config.txt
          echo "UUID: ${{ env.XRAY_UUID }}" >> v2ray-config.txt
          echo "IP: ${{ env.RUNNER_IP }}" >> v2ray-config.txt
          echo "پورت: 8080" >> v2ray-config.txt
          
          cat v2ray-config.txt

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2ray-config.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "add v2ray config for ip ${{ env.RUNNER_IP }}"
          git push