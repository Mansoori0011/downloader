name: SSH Tunnel with 3x-UI

on:
  workflow_dispatch:  # فقط دستی اجرا بشه

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install tmate and 3x-ui
        run: |
          # نصب tmate برای اتصال SSH
          sudo apt update
          sudo apt install -y tmate curl wget

      - name: Start tmate
        run: |
          # اجرای tmate در background
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "========================================="
          echo "SSH Connection String:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo "========================================="
          echo "tmate is running. Press Ctrl+C to stop."
          # نگه داشتن workflow برای 6 ساعت (حداکثر)
          sleep 6h