name: Fetch Telegram Messages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup Puppeteer
      run: |
        npm init -y
        npm install puppeteer

    - name: Fetch with Cookie
      run: |
        cat > fetch.js << 'ENDOFSCRIPT'
        const puppeteer = require('puppeteer');
        const fs = require('fs');

        (async () => {
          const browser = await puppeteer.launch({
            headless: 'new',
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 1280, height: 720 });

          await page.setCookie({
            name: 'stel_disable',
            value: '1',
            domain: '.t.me',
            path: '/'
          });

          await page.goto('https://t.me/s/AriyanProxy', {
            waitUntil: 'networkidle2',
            timeout: 30000
          });

          await new Promise(r => setTimeout(r, 3000));

          const currentUrl = page.url();
          console.log('Current URL:', currentUrl);

          await page.screenshot({ path: 'debug.png', fullPage: false });

          const html = await page.content();
          console.log('HTML length:', html.length);
          console.log('Contains messages:', html.includes('tgme_widget_message'));

          fs.writeFileSync('debug.html', html);

          let messages = [];

          const hasMessages = html.includes('tgme_widget_message_wrap');
          
          if (hasMessages) {
            messages = await page.evaluate(() => {
              const wrappers = document.querySelectorAll('.tgme_widget_message_wrap');
              const result = [];
              wrappers.forEach(wrap => {
                const textEl = wrap.querySelector('.tgme_widget_message_text');
                const timeEl = wrap.querySelector('time.datetime');
                if (textEl && timeEl) {
                  result.push({
                    datetime: timeEl.getAttribute('datetime'),
                    text: textEl.innerText.trim()
                  });
                }
              });
              return result;
            });
          }

          const now = new Date();
          const twoDaysAgo = new Date(now - 2 * 24 * 60 * 60 * 1000);

          const recent = messages.filter(m => new Date(m.datetime) >= twoDaysAgo);

          let output = `📢 کانال AriyanProxy\n`;
          output += `📅 تاریخ: ${now.toISOString().split('T')[0]}\n`;
          output += `📝 پیام‌های ۴۸ ساعت اخیر: ${recent.length}\n`;
          output += `🔍 کل پیام‌های استخراج شده: ${messages.length}\n`;
          output += `🌐 URL فعلی: ${currentUrl}\n`;
          output += `═`.repeat(55) + `\n\n`;

          if (recent.length === 0) {
            output += `⚠️ پیامی در ۴۸ ساعت اخیر پیدا نشد.\n\n`;
            if (messages.length > 0) {
              output += `نمونه پیام‌ها (برای دیباگ):\n`;
              messages.slice(0, 5).forEach(m => {
                output += `🕒 ${m.datetime}: ${m.text.substring(0, 100)}...\n`;
              });
            } else {
              output += `💡 صفحه پیام‌ها لود نشد. شاید ریدایرکت شده به صفحه لندینگ.\n`;
              output += `URL فعلی: ${currentUrl}\n`;
            }
          } else {
            recent.forEach(m => {
              output += `🕒 ${m.datetime}\n`;
              output += `${m.text}\n`;
              output += `─`.repeat(45) + `\n\n`;
            });
          }

          fs.writeFileSync('telegram_messages.txt', output, 'utf8');
          console.log(output);

          await browser.close();
        })();
        ENDOFSCRIPT

        node fetch.js

    - name: Push all
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add telegram_messages.txt debug.html debug.png 2>/dev/null || true
        git commit -m "📢 AriyanProxy — $(date +%s)" || true
        git pull --rebase
        git push