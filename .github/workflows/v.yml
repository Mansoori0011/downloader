name: VPS with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Create temporary VPS container
        run: |
          docker run -d \
            --name temp-vps \
            -p 80:80 \
            -p 443:443 \
            -p 54321:54321 \
            ubuntu:22.04 \
            sleep 10800

      - name: Install dependencies & Panel
        run: |
          docker exec temp-vps bash -c "
            apt-get update && \
            apt-get install -y curl wget && \
            curl -fsSL https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | bash
          "

      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Create Cloudflare Tunnel (Public URL)
        uses: AnimMouse/setup-cloudflared/tunnel@v2
        with:
          url: http://localhost:54321   # پورت پنل

      - name: Show Access Info
        run: |
          echo "═══════════════════════════════════════════"
          echo "✅ VPS READY - Accessible from ANYWHERE!"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "🔗 Find your public URL in the logs above ☝️"
          echo "   It looks like: https://random-name.trycloudflare.com"
          echo ""
          echo "🌐 Panel Login: admin / admin"
          echo "⏰ Active for 3 hours"
          echo "═══════════════════════════════════════════"

      - name: Keep Alive
        run: sleep 10800

      - name: Cleanup
        if: always()
        run: |
          docker stop temp-vps || true
          docker rm temp-vps || true