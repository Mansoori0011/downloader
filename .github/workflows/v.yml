name: "دانلود کامل سایت با تمام CDN ها"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس سایت'
        required: true
        default: 'https://example.com'

jobs:
  download-full:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🌐 Download website + all CDNs
        run: |
          rm -rf ./site
          mkdir -p ./site
          cd ./site
          
          # استخراج دامنه اصلی
          MAIN_DOMAIN=$(echo "${{ github.event.inputs.site_url }}" | awk -F/ '{print $3}')
          
          # دانلود با اجازه به دامنه های مختلف (CDN ها)
          wget \
            --recursive \
            --level=5 \
            --no-clobber \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --restrict-file-names=windows \
            --domains=$MAIN_DOMAIN,cloudflare.com,cloudfront.net,amazonaws.com,fastly.net,cdninstagram.com,cdn.example.com \
            --span-hosts \
            --no-parent \
            --wait=1 \
            --limit-rate=200k \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --execute robots=off \
            --accept="*.html,*.htm,*.css,*.js,*.jpg,*.jpeg,*.png,*.gif,*.webp,*.svg,*.ico,*.woff,*.woff2,*.ttf,*.mp4,*.mp3" \
            --header="Accept: image/webp,image/apng,image/*,*/*;q=0.8" \
            "${{ github.event.inputs.site_url }}"
          
          cd ..

      - name: 🔍 Extract all image URLs from HTML and CSS
        run: |
          cd ./site
          
          # پیدا کردن تمام عکس‌ها از فایل‌های HTML
          find . -name "*.html" -o -name "*.htm" | while read file; do
            grep -Eo '(https?://[^"'"'"']+\.(jpg|jpeg|png|gif|webp|svg|ico))' "$file" >> /tmp/all_images.txt
            grep -Eo 'url\([^)]+\.(jpg|jpeg|png|gif|webp)' "$file" | sed 's/url(//g' | sed 's/)//g' >> /tmp/all_images.txt
          done
          
          # پیدا کردن از فایل‌های CSS
          find . -name "*.css" | while read file; do
            grep -Eo '(https?://[^"'"'"']+\.(jpg|jpeg|png|gif|webp|svg))' "$file" >> /tmp/all_images.txt
            grep -Eo 'url\([^)]+\.(jpg|jpeg|png|gif|webp)' "$file" | sed 's/url(//g' | sed 's/)//g' >> /tmp/all_images.txt
          done
          
          # حذف تکراری‌ها
          sort -u /tmp/all_images.txt > /tmp/unique_images.txt
          
          # دانلود تمام عکس‌های پیدا شده
          mkdir -p ./downloaded_images
          while IFS= read -r imgurl; do
            if [ ! -z "$imgurl" ]; then
              filename=$(basename "$imgurl" | cut -d'?' -f1 | cut -d'#' -f1)
              echo "Downloading: $imgurl"
              wget --timeout=10 --tries=3 --quiet -P ./downloaded_images/ "$imgurl" 2>/dev/null || true
            fi
          done < /tmp/unique_images.txt
          
          cd ..

      - name: 📦 Create ZIP with everything
        run: |
          zip -r site-full.zip ./site/
          echo "✅ فایل ZIP ساخته شد"

      - name: 📱 Android instructions
        run: |
          cat > ANDROID_GUIDE.txt << 'EOF'
          ========================================
          📱 راهنمای اندروید
          ========================================
          
          1. دانلود فایل site-full.zip
          2. نصب Zarchiver از گوگل پلی
          3. اکسترکت فایل zip
          4. پوشه site رو باز کن
          5. فایل index.html رو با Chrome باز کن
          
          ✅ تمام عکس‌ها (حتی از CDN ها) ذخیره شده‌اند
          ✅ آفلاین کامل کار می‌کند
          
          اگه بعضی عکس‌ها نمایش داده نشد:
          - فایل index.html رو با Notepad باز کن
          - آدرس HTTPS رو به HTTP تغییر بده
          ========================================
          EOF

      - name: 💾 Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add site/ site-full.zip ANDROID_GUIDE.txt
          git diff --staged --quiet || git commit -m "Full download with CDNs: ${{ github.event.inputs.site_url }}"
          git push

      - name: ✅ Show links
        run: |
          echo "=========================================="
          echo "✅ دانلود کامل شد"
          echo ""
          echo "📦 دانلود ZIP (بهترین گزینه):"
          echo "https://github.com/${{ github.repository }}/blob/main/site-full.zip"
          echo ""
          echo "📁 مشاهده فایل‌ها:"
          echo "https://github.com/${{ github.repository }}/tree/master/site"
          echo ""
          echo "📱 توی گوشی، فایل ZIP رو دانلود و اکسترکت کن"
          echo "=========================================="