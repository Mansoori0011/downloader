name: Telegram MTProto Proxy
on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download and Run MTProto Proxy
        run: |
          # دانلود آخرین نسخه mtproto.zig که بسیار سبک و قدرتمنده [citation:3]
          curl -L -o mtproto-proxy https://github.com/sleep3r/mtproto.zig/releases/latest/download/mtproto-proxy-linux-amd64
          chmod +x mtproto-proxy

          # تولید یک سکرت تصادفی و قدرتمند برای پروکسی
          SECRET=$(head -c 16 /dev/urandom | xxd -ps)
          echo "SECRET=$SECRET" >> $GITHUB_ENV

          # اجرای پروکسی با تنظیمات بهینه برای دور زدن فیلترینگ
          # پورت 443 و Fake-TLS فعال شود تا ترافیک شبیه HTTPS معمولی دیده شود [citation:3]
          ./mtproto-proxy --port 443 --secret "$SECRET" --tls-domain "www.google.com" --drs &
          
          echo "✅ MTProto Proxy is ready."

      - name: Create Tunnel & Get Connection Link
        run: |
          # نصب cloudflared برای ایجاد تونل امن
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # ایجاد تونل برای پورت 443 که پروکسی روی آن اجرا شده
          nohup cloudflared tunnel --url tcp://localhost:443 > tunnel.log 2>&1 &
          sleep 15
          
          # استخراج آدرس تونل
          TUNNEL_URL=$(grep -oP 'trycloudflare\.com:\d+' tunnel.log | head -1)
          TUNNEL_HOST=$(echo $TUNNEL_URL | cut -d: -f1)
          TUNNEL_PORT=$(echo $TUNNEL_URL | cut -d: -f2)
          
          # ساخت لینک اتصال تلگرام
          TG_LINK="tg://proxy?server=$TUNNEL_HOST&port=$TUNNEL_PORT&secret=ee$SECRET"
          
          echo "========================================="
          echo "✅ پروکسی تلگرام آماده است!"
          echo "📱 لینک اتصال (کپی کنید و در مرورگر باز کنید):"
          echo "$TG_LINK"
          echo "========================================="

      - name: Keep Alive
        run: sleep 21600