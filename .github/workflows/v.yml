name: "دانلود کامل سایت (بدون Checkout)"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس کامل سایت'
        required: true
        default: 'https://example.com'

jobs:
  download-site:
    runs-on: ubuntu-latest
    steps:
      # ❌ هیچ Checkout ای اینجا نیست
      
      - name: نصب wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: دانلود کامل سایت
        run: |
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=2 \
            --directory-prefix=./sitemirror \
            --execute robots=off \
            --user-agent="Mozilla/5.0 (Android 14; Mobile) AppleWebKit/537.36" \
            "${{ github.event.inputs.site_url }}"

      - name: فشرده‌سازی فایل‌ها
        run: |
          zip -r site-mirror.zip ./sitemirror

      - name: آپلود به عنوان Artifact (بدون commit!)
        uses: actions/upload-artifact@v4
        with:
          name: site-mirror
          path: site-mirror.zip
          retention-days: 7