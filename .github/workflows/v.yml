name: Nova Proxy with Built-in DNS
on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Setup DNS and Proxy Server
        run: |
          # نصب dnsmasq برای حل DNS محلی
          sudo apt update
          sudo apt install -y dnsmasq curl
          
          # تنظیم dnsmasq برای استفاده از DNS ریشه (بدون فیلتر)
          sudo mkdir -p /etc/dnsmasq.d
          echo "no-resolv" | sudo tee /etc/dnsmasq.d/custom.conf
          echo "server=8.8.8.8" | sudo tee -a /etc/dnsmasq.d/custom.conf
          echo "server=1.1.1.1" | sudo tee -a /etc/dnsmasq.d/custom.conf
          echo "listen-address=127.0.0.1" | sudo tee -a /etc/dnsmasq.d/custom.conf
          echo "bind-interfaces" | sudo tee -a /etc/dnsmasq.d/custom.conf
          
          sudo systemctl restart dnsmasq
          
          # تست DNS
          echo "Testing DNS..."
          nslookup google.com 127.0.0.1
          
          # ایجاد پروکسی HTTP با قابلیت حل DNS داخلی
          cat > proxy-server.py << 'EOF'
          import http.server
          import socketserver
          import urllib.request
          import socket
          
          class Proxy(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  try:
                      # استخراج آدرس مقصد از مسیر
                      path = self.path
                      if path.startswith('/http'):
                          url = path[1:]  # حذف / اول
                      else:
                          # فرمت جدید: /http://google.com
                          url = self.path[1:]
                      
                      print(f"Proxying: {url}")
                      
                      # تنظیم DNS محلی
                      req = urllib.request.Request(url)
                      req.add_header('Host', urllib.parse.urlparse(url).netloc)
                      
                      response = urllib.request.urlopen(req, timeout=30)
                      
                      self.send_response(200)
                      self.send_header('Content-Type', response.headers.get('Content-Type', 'text/html'))
                      self.end_headers()
                      self.wfile.write(response.read())
                      
                  except Exception as e:
                      print(f"Error: {e}")
                      self.send_response(500)
                      self.end_headers()
                      self.wfile.write(f"Proxy Error: {e}".encode())
          
          PORT = 8080
          with socketserver.TCPServer(("", PORT), Proxy) as httpd:
              print(f"Proxy running on port {PORT}")
              httpd.serve_forever()
          EOF
          
          # اجرای پروکسی
          python3 proxy-server.py &
          sleep 3
          
          echo "✅ Proxy with DNS resolver is running!"

      - name: Create Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          nohup cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          sleep 15
          
          TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log)
          
          echo "========================================="
          echo "🌐 Tunnel: $TUNNEL_URL"
          echo "📱 iPhone/Mac Proxy:"
          echo "   Server: $(echo $TUNNEL_URL | sed 's|https://||')"
          echo "   Port: 443"
          echo ""
          echo "📋 v2rayNG Import:"
          echo "vmess://$(echo -n "{\"add\":\"$(echo $TUNNEL_URL | sed 's|https://||')\",\"aid\":\"0\",\"host\":\"$(echo $TUNNEL_URL | sed 's|https://||')\",\"id\":\"ffffffff-ffff-ffff-ffff-ffffffffffff\",\"net\":\"tcp\",\"path\":\"/\",\"port\":\"443\",\"ps\":\"Nova+DNS\",\"tls\":\"tls\",\"type\":\"http\",\"v\":\"2\"}" | base64 -w 0)"
          echo "========================================="
          
          mkdir -p config
          echo "Server: $(echo $TUNNEL_URL | sed 's|https://||')" > config/proxy-config.txt
          echo "Port: 443" >> config/proxy-config.txt
          echo "Type: HTTP" >> config/proxy-config.txt
          echo "Path: /" >> config/proxy-config.txt

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: proxy-config
          path: config/

      - name: Keep Alive
        run: sleep 21600