name: 'برقراری تونل برای یک پروکسی SOCKS5'

on:
  workflow_dispatch:  # با کلیک روی دکمه Run workflow اجرا می‌شود

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب ابزارهای مورد نیاز
        run: |
          sudo apt-get update
          # نصب dante-server برای اجرای یک پروکسی SOCKS5 سبک
          sudo apt-get install -y dante-server
          # دانلود ابزار cloudflared برای ایجاد تونل
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: راه‌اندازی سرور SOCKS5
        run: |
          # کانفیگ ساده danted برای اجرا روی همه پورت‌ها
          sudo bash -c 'cat > /etc/danted.conf << EOF
          logoutput: stderr
          internal: 0.0.0.0 port=1080
          external: eth0
          method: none
          client pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
          }
          pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              protocol: tcp
          }
          EOF'
          sudo danted -f /etc/danted.conf
          echo "✅ پروکسی SOCKS5 روی پورت 1080 راه‌اندازی شد."

      - name: ایجاد تونل عمومی با Cloudflared
        run: |
          # اجرای تونل به سمت پورت پروکسی
          cloudflared tunnel --url http://localhost:1080 &
          sleep 10
          # دریافت و نمایش آدرس عمومی تونل
          TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "🌐 آدرس تونل عمومی شما: $TUNNEL_URL"
          echo "🔑 این یک پروکسی SOCKS5 است. از آن در برنامه‌ها استفاده کنید."
          # نگه داشتن جریان اجرا
          tail -f /dev/null