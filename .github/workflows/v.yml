name: "دانلود محتوای سایت (نسخه مخصوص)"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس صفحه مورد نظر'
        required: true
      download_images:
        description: 'دانلود عکس‌ها (yes/no)'
        default: 'yes'
      download_videos:
        description: 'دانلود ویدئوها (yes/no)'
        default: 'no'

jobs:
  download-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl grep sed
          # نصب yt-dlp برای دانلود ویدئو (اگه لازم باشه)
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download HTML and images
        run: |
          mkdir -p ./content
          cd ./content
          
          # دانلود صفحه اصلی و منابع
          wget \
            --recursive \
            --level=2 \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --no-parent \
            --wait=1 \
            --limit-rate=500k \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --execute robots=off \
            --accept="*.html,*.htm,*.css,*.js,*.jpg,*.jpeg,*.png,*.gif,*.webp" \
            "${{ github.event.inputs.site_url }}"
          
          cd ..

      - name: Extract and download images
        if: github.event.inputs.download_images == 'yes'
        run: |
          cd ./content
          
          # استخراج لینک همه عکس‌ها
          find . -type f -name "*.html" -exec grep -Eo 'https?://[^"'"'"']+\.(jpg|jpeg|png|gif|webp|svg)' {} \; > /tmp/img_links.txt
          find . -type f -name "*.css" -exec grep -Eo 'url\([^)]+\.(jpg|jpeg|png|gif|webp)' {} \; | sed 's/url(//g' | sed 's/)//g' >> /tmp/img_links.txt
          
          sort -u /tmp/img_links.txt | while read url; do
            echo "⬇️ $url"
            wget --timeout=15 --tries=2 -nc "$url" 2>/dev/null || true
          done
          
          cd ..

      - name: Download videos (if enabled)
        if: github.event.inputs.download_videos == 'yes'
        run: |
          mkdir -p ./videos
          cd ./content
          
          # استخراج لینک ویدئوها از صفحه
          grep -Eo 'https?://[^"'"'"']+\.(mp4|webm|m3u8|ts)' ./*.html 2>/dev/null > /tmp/video_links.txt || true
          grep -Eo '(src|data-src|data-video)=["'"'"'][^"'"'"']+\.(mp4|webm)' ./*.html 2>/dev/null >> /tmp/video_links.txt || true
          
          sort -u /tmp/video_links.txt | while read url; do
            clean_url=$(echo "$url" | sed 's/^.*=//g' | sed 's/["'"'"']//g')
            echo "🎬 دانلود ویدئو: $clean_url"
            yt-dlp -o "../videos/%(title)s.%(ext)s" "$clean_url" || true
          done
          
          cd ..

      - name: Create zip file
        run: |
          zip -r website_content.zip ./content ./videos 2>/dev/null || zip -r website_content.zip ./content
          ls -lh website_content.zip

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add website_content.zip content/ videos/ 2>/dev/null || true
          git commit -m "Downloaded: ${{ github.event.inputs.site_url }}" || echo "No changes"
          git push

      - name: Show result
        run: |
          echo "=========================================="
          echo "✅ دانلود انجام شد"
          echo "📦 فایل ZIP:"
          echo "https://github.com/${{ github.repository }}/blob/master/website_content.zip"
          echo ""
          echo "⚠️ توجه: برای این نوع سایت‌ها:"
          echo "- عکس‌ها معمولاً دانلود می‌شن"
          echo "- ویدئوها فقط با گزینه yes دانلود می‌شن"
          echo "- ویدئوهای استریمینگ (m3u8) نیاز به ابزار جدا دارن"
          echo "=========================================="