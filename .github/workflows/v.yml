name: "SingleFile - ذخیره کامل سایت در یک فایل"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس سایت'
        required: true

jobs:
  singlefile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install SingleFile
        run: |
          pip install singlefile
          playwright install chromium

      - name: 💾 Save as SingleFile HTML
        run: |
          mkdir -p ./output
          singlefile "${{ github.event.inputs.site_url }}" --output="./output/site_complete.html"
          echo "✅ فایل ذخیره شد" >> ./output/info.txt

      - name: 📱 Add Android guide
        run: |
          echo "📱 فایل site_complete.html رو توی مرورگر گوشی باز کن" > ./output/README.txt

      - name: 💾 Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "SingleFile: ${{ github.event.inputs.site_url }}" || echo "تغییری نیست"
          git push