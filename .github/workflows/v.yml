name: Build V2Ray Config on Runner

on:
  workflow_dispatch:  # فقط خودت دستی اجرا کن

permissions:
  contents: write

jobs:
  setup-vpn-on-runner:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت IP Runner
        id: get_ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$IP" >> $GITHUB_ENV
          echo "IP Runner: $IP"

      - name: نصب Xray و پیکربندی خودکار
        run: |
          # نصب XrayCore با اسکریپت رسمی
          bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          # ساخت UUID تصادفی
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID: $UUID"

          # پیکربندی فایل کانفیگ سرور (Xray)
          cat > /usr/local/etc/xray/config.json << EOF
          {
            "inbounds": [
              {
                "port": 443,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$UUID",
                      "flow": "xtls-rprx-vision",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "none",
                  "wsSettings": {
                    "path": "/ray"
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {}
              }
            ]
          }
          EOF

          # راه‌اندازی سرویس Xray
          systemctl restart xray
          systemctl enable xray

          # ذخیره UUID در متغیر محیطی برای مرحله بعد
          echo "XRAY_UUID=$UUID" >> $GITHUB_ENV

      - name: تولید لینک V2RayNG
        run: |
          # ساخت لینک با فرمت VLESS
          CONFIG_URL="vless://${{ env.XRAY_UUID }}@${{ env.RUNNER_IP }}:443?encryption=none&security=none&type=ws&path=%2Fray#VPS-GitHub-Actions"
          
          echo "✅ کانفیگ شما آماده است:"
          echo "$CONFIG_URL"
          
          # ذخیره در فایل
          echo "آخرین بروزرسانی: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > v2ray-config.txt
          echo "کانفیگ V2RayNG (کپی کرده و در اپ جایگذاری کن):" >> v2ray-config.txt
          echo "$CONFIG_URL" >> v2ray-config.txt
          echo "UUID: ${{ env.XRAY_UUID }}" >> v2ray-config.txt
          echo "Server IP: ${{ env.RUNNER_IP }}" >> v2ray-config.txt

      - name: ذخیره خودکار در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2ray-config.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "update v2ray config for ip ${{ env.RUNNER_IP }}"
          git push 