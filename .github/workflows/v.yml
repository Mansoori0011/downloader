name: “دانلود کامل سایت - نسخه سریع”

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: ‘آدرس کامل سایت’
        required: true
        default: ‘https://example.com’

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 🚀 کلید سرعت: فقط آخرین commit رو میاره (depth: 1)
      - name: 📥 Fast checkout (without history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 🌐 Download full website
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

          rm -rf ./site-mirror
          
          # دانلود با حداکثر سرعت (بدون محدودیت)
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=0 \
            --timeout=10 \
            --tries=3 \
            --directory-prefix=./site-mirror \
            --execute robots=off \
            --user-agent="Mozilla/5.0 (Android 14; Mobile) Safari/537.36" \
            "${{ github.event.inputs.site_url }}"

      - name: 💾 Quick push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add site-mirror/
          git diff --staged --quiet || git commit -m "✅ سایت دانلود شد: $(date '+%H:%M:%S')"
          git push

      - name: 📱 لینک نهایی
        run: |
          echo "=========================================="
          echo "✅ انجام شد! لینک:"
          echo "https://github.com/${{ github.repository }}/tree/main/site-mirror"
          echo "=========================================="