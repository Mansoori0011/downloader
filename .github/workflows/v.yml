name: CDN-V2Ray

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - uses: actions/checkout@v4

    - name: Setup
      run: |
        wget -q https://github.com/XTLS/Xray-core/releases/download/v25.3.6/Xray-linux-64.zip
        unzip -o -q Xray-linux-64.zip
        chmod +x xray

    - name: Run V2Ray WebSocket
      run: |
        UUID=$(cat /proc/sys/kernel/random/uuid)
        
        cat > config.json << EOF
        {
          "inbounds": [{
            "port": 8080,
            "listen": "0.0.0.0",
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "$UUID"}],
              "decryption": "none"
            },
            "streamSettings": {
              "network": "ws",
              "wsSettings": {
                "path": "/"
              }
            }
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF
        
        ./xray run -config config.json &
        sleep 3
        
        VLESS="vless://$UUID@raw.githubusercontent.com:443?encryption=none&security=tls&type=ws&path=%2F&sni=raw.githubusercontent.com&host=raw.githubusercontent.com#CDN"
        
        echo "$VLESS" > vless-cdn.txt
        echo "Config: $VLESS"
        
        git config user.name "actions"
        git config user.email "actions@github.com"
        git add vless-cdn.txt
        git commit -m "Update CDN config $(date +%s)" || true
        git push
        
        sleep 20500