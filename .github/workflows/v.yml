name: Fetch Telegram via RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Fetch with headless browser (standalone)
      run: |
        npm init -y
        npm install puppeteer

    - name: Fetch messages
      run: |
        cat > fetch.js << 'EOF'
        const puppeteer = require('puppeteer');
        const fs = require('fs');

        (async () => {
          const browser = await puppeteer.launch({
            headless: 'new',
            args: [
              '--no-sandbox',
              '--disable-setuid-sandbox',
              '--disable-web-security',
              '--disable-features=VizDisplayCompositor',
              '--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            ]
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 1366, height: 768 });
          
          await page.setRequestInterception(true);
          page.on('request', (req) => {
            if (['image', 'stylesheet', 'font', 'media'].includes(req.resourceType())) {
              req.abort();
            } else {
              req.continue();
            }
          });

          try {
            await page.goto('https://t.me/s/AriyanProxy', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });

            await new Promise(r => setTimeout(r, 5000));

            const html = await page.content();
            
            const regex = /<div class="tgme_widget_message_text(?:[^"]*)"[^>]*>([\s\S]*?)<\/div>\s*(?:[\s\S]*?)<time[^>]*datetime="([^"]*)"/gi;
            
            const messages = [];
            let match;
            while ((match = regex.exec(html)) !== null) {
              const text = match[1].replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, '').replace(/\s+/g, ' ').trim();
              const date = match[2];
              if (text && date) {
                messages.push({ date, text });
              }
            }

            const now = new Date();
            const cutoff = new Date(now - 2 * 24 * 60 * 60 * 1000);

            const recent = messages.filter(m => new Date(m.date) >= cutoff);

            let output = `📢 کانال AriyanProxy\n`;
            output += `📅 تاریخ: ${now.toISOString().split('T')[0]}\n`;
            output += `📝 پیام‌های ۴۸ ساعت اخیر: ${recent.length}\n`;
            output += `═`.repeat(55) + `\n\n`;

            if (recent.length === 0) {
              output += `⚠️ هیچ پیامی پیدا نشد.\n\n`;
              output += `کل پیام‌های استخراج شده: ${messages.length}\n`;
              if (messages.length > 0) {
                output += `نمونه آخرین پیام: [${messages[0].date}] ${messages[0].text.substring(0, 100)}\n`;
              }
            } else {
              recent.forEach((m, i) => {
                output += `🕒 ${m.date}\n`;
                output += `${m.text}\n`;
                output += `─`.repeat(45) + `\n\n`;
              });
            }

            fs.writeFileSync('telegram_messages.txt', output, 'utf8');
            console.log(`✅ ${recent.length} پیام ذخیره شد`);
          } catch (err) {
            console.error('Error:', err.message);
            let output = `⚠️ خطا: ${err.message}\n`;
            fs.writeFileSync('telegram_messages.txt', output, 'utf8');
          } finally {
            await browser.close();
          }
        })();
        EOF

        node fetch.js

    - name: Push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add telegram_messages.txt
        git commit -m "📢 AriyanProxy — $(date +%s)" || true
        git pull --rebase
        git push