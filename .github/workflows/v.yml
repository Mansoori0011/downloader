name: "ذخیره صفحه به صورت MHTML با Puppeteer"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس صفحه مورد نظر'
        required: true
        default: 'https://example.com'

jobs:
  save-as-mhtml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 دریافت کدها
        uses: actions/checkout@v4

      - name: 📦 نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 نصب Puppeteer
        run: |
          npm install puppeteer
          npx puppeteer browsers install chrome

      - name: 📸 ذخیره صفحه به عنوان MHTML
        run: |
          node - << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          (async () => {
            console.log('🚀 در حال راه‌اندازی مرورگر کروم...');
            const browser = await puppeteer.launch({
              headless: 'new',
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu'
              ]
            });
            
            const page = await browser.newPage();
            
            const siteUrl = '${{ github.event.inputs.site_url }}';
            console.log(`🌐 در حال بارگذاری صفحه: ${siteUrl}`);
            
            await page.goto(siteUrl, { 
              waitUntil: 'networkidle2',
              timeout: 60000 
            });
            
            // منتظر میمونیم تا عکس‌های تامبنیل لود بشن
            console.log('⏳ منتظر لود کامل عکس‌ها (15 ثانیه)...');
            await page.waitForTimeout(15000);
            
            // اسکرول به پایین برای لود عکس‌های بیشتر
            await page.evaluate(async () => {
              window.scrollTo(0, document.body.scrollHeight);
            });
            await page.waitForTimeout(3000);
            
            console.log('📄 در حال گرفتن خروجی MHTML...');
            
            // گرفتن MHTML از طریق CDP
            const client = await page.target().createCDPSession();
            const { data } = await client.send('Page.captureSnapshot', { format: 'mhtml' });
            
            // ذخیره فایل
            fs.writeFileSync('page_complete.mhtml', data);
            
            console.log(`✅ فایل ذخیره شد: page_complete.mhtml (حجم: ${(data.length / 1024).toFixed(2)} KB)`);
            
            await browser.close();
          })().catch(err => {
            console.error('❌ خطا:', err);
            process.exit(1);
          });
          EOF

      - name: 💾 ذخیره در مخزن
        run: |
          if [ -f "page_complete.mhtml" ]; then
            mkdir -p output
            mv page_complete.mhtml output/
            
            cat > output/README.txt << 'EOF'
            ========================================
            ✅ فایل MHTML آماده استفاده است!
            ========================================
            
            📱 نحوه استفاده در اندروید:
            
            1. فایل page_complete.mhtml رو دانلود کن
            2. با مرورگر کروم اندروید باز کن
            3. همه عکس‌ها و استایل‌ها کامل نمایش داده می‌شن
            
            🔥 این فایل توسط خود کروم ساخته شده
            ✅ تمام عکس‌های تامبنیل داخل فایل هستن
            ========================================
            EOF
            
            echo "✅ فایل با موفقیت ساخته شد"
          else
            echo "❌ خطا: فایل MHTML ساخته نشد"
            exit 1
          fi

      - name: ارسال به گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add output/
          git diff --staged --quiet || git commit -m "MHTML: ${{ github.event.inputs.site_url }}"
          git push

      - name: نمایش لینک
        run: |
          echo "=========================================="
          echo "✅ دانلود کامل شد!"
          echo ""
          echo "📥 لینک دانلود فایل MHTML:"
          echo "https://github.com/${{ github.repository }}/tree/master/output/page_complete.mhtml"
          echo ""
          echo "📱 توی گوشی لینک رو باز کن و دانلود کن"
          echo "=========================================="