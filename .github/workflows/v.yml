name: Deploy VPN & Check Ports

on:
  workflow_dispatch:  # با این گزینه، خودت هر موقع خواستی اجرایش می‌کنی

jobs:
  setup-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 (1) اتصال به VPS و نصب WireGuard
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}     # IP سرور مجانیت اینجا
          username: ubuntu                # یا root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo apt update
            sudo apt install -y wireguard
            echo "WireGuard با موفقیت نصب شد!"

      - name: 🔍 (2) اسکن پورت‌های باز VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo apt install -y nmap
            echo "در حال اسکن پورت‌های باز..."
            nmap -sV -p- localhost