name: "دانلود کامل سایت با تمام عکس‌ها"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس کامل سایت'
        required: true
        default: 'https://example.com'

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget httrack

      - name: 🌐 Download complete website with HTTrack
        run: |
          rm -rf ./mirrored-site
          mkdir -p ./mirrored-site
          
          httrack "${{ github.event.inputs.site_url }}" \
            -O ./mirrored-site \
            --mirror \
            --robots=0 \
            --depth=3 \
            --ext-depth=3 \
            --keep-alive \
            --user-agent="Mozilla/5.0 (Android 14; Mobile) Safari/537.36" \
            --connection-patch="Accept-Encoding:gzip" \
            "+*$(echo "${{ github.event.inputs.site_url }}" | awk -F/ '{print $3}')*" \
            "-*.jpg?*" \
            "-*.png?*" \
            "-*.gif?*" \
            "-*.css?*" \
            "-*.js?*"

      - name: 🔍 Extract all image URLs from HTML
        run: |
          cd ./mirrored-site
          find . -name "*.html" -o -name "*.htm" | while read htmlfile; do
            grep -Eo '(https?://[^"]+\.(jpg|jpeg|png|gif|webp|svg|bmp|ico))' "$htmlfile" >> /tmp/all_images.txt || true
            grep -Eo 'url\(([^)]+)\)' "$htmlfile" | sed 's/url(//g' | sed 's/)//g' >> /tmp/all_images_css.txt || true
          done
          
          sort -u /tmp/all_images.txt /tmp/all_images_css.txt > /tmp/final_images.txt || true

      - name: 📸 Download all missing images
        run: |
          mkdir -p ./mirrored-site/all_images
          cd ./mirrored-site
          
          while IFS= read -r imgurl; do
            if [ ! -z "$imgurl" ]; then
              filename=$(basename "$imgurl" | cut -d'?' -f1)
              wget --timeout=10 --tries=2 --quiet "$imgurl" -O "all_images/$filename" || true
            fi
          done < /tmp/final_images.txt

      - name: 💾 Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add mirrored-site/
          git diff --staged --quiet || git commit -m "کامل: ${{ github.event.inputs.site_url }} با تمام عکس‌ها"
          git push

      - name: ✅ نمایش لینک
        run: |
          echo "=========================================="
          echo "✅ سایت و تمام عکس‌ها دانلود شد"
          echo "🔗 https://github.com/${{ github.repository }}/tree/master/mirrored-site"
          echo "=========================================="