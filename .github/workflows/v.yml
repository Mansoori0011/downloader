name: 'برقراری تونل برای پروکسی HTTP'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب ابزارهای مورد نیاز
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          # نصب tinyproxy (یک پروکسی HTTP سبک)
          sudo apt-get install -y tinyproxy
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: راه‌اندازی سرور HTTP Proxy
        run: |
          # تنظیمات tinyproxy
          sudo bash -c 'cat > /etc/tinyproxy/tinyproxy.conf << EOF
          Port 8080
          Listen 0.0.0.0
          Allow 0.0.0.0/0
          Timeout 600
          DefaultErrorFile "/usr/share/tinyproxy/default.html"
          StatFile "/usr/share/tinyproxy/stats.html"
          LogFile "/var/log/tinyproxy/tinyproxy.log"
          LogLevel Info
          PidFile "/run/tinyproxy/tinyproxy.pid"
          MaxClients 100
          MinSpareServers 5
          MaxSpareServers 20
          StartServers 10
          MaxRequestsPerChild 0
          ViaProxyName "tinyproxy"
          DisableViaHeader Yes
          EOF'
          
          sudo systemctl start tinyproxy || sudo service tinyproxy start
          echo "✅ پروکسی HTTP روی پورت 8080 راه‌اندازی شد."

      - name: ایجاد تونل و نمایش آدرس
        run: |
          cloudflared tunnel --url http://localhost:8080 > cloudflared.log 2>&1 &
          sleep 15
          
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1)
          
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ تونل با موفقیت برقرار شد!"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          if [ -n "$TUNNEL_URL" ]; then
            echo "🌐 آدرس تونل عمومی: $TUNNEL_URL"
            echo ""
            echo "📱 در برنامه سایفون (Psiphon) تنظیم کنید:"
            echo "   ┌─────────────────────────────────────────┐"
            echo "   │ ☑️ اتصال از طریق پروکسی HTTP            │"
            echo "   │ ☑️ استفاده از این تنظیمات:              │"
            echo "   │                                         │"
            echo "   │    آدرس: $(echo $TUNNEL_URL | sed 's|https://||' | sed 's|/||') │"
            echo "   │    پورت: 80                             │"
            echo "   └─────────────────────────────────────────┘"
            echo ""
            echo "⏱️ این تونل به مدت 6 ساعت فعال خواهد ماند."
          else
            echo "❌ خطا: آدرس تونل پیدا نشد."
            cat cloudflared.log
          fi
          echo "═══════════════════════════════════════════════════════════"
          
          sleep 6h