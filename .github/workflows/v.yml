name: "دانلود کامل صفحه + تامبنیل‌ها (حتی از CDN های مختلف)"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس صفحه'
        required: true

jobs:
  download-all-thumbnails:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl grep sed jq

      - name: Download HTML and embedded resources
        run: |
          mkdir -p site
          cd site
          
          # دانلود صفحه اصلی با تمام منابع مستقیم
          wget -p -k -E -np -e robots=off --limit-rate=500k \
            --header="Accept: image/webp,image/apng,image/*,*/*;q=0.8" \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "${{ github.event.inputs.site_url }}"
          
          cd ..

      - name: Extract ALL thumbnail URLs (including from JavaScript)
        run: |
          cd site
          
          # استخراج از فایل‌های HTML و JS
          find . -type f \( -name "*.html" -o -name "*.htm" -o -name "*.js" \) | while read file; do
            # الگوهای رایج تامبنیل در سایت‌های بزرگ
            grep -Eoi '(https?://[^"'"'"']+\.(jpg|jpeg|png|gif|webp|avif))' "$file" >> /tmp/raw_urls.txt
            grep -Eoi '"url":"[^"]+\.(jpg|jpeg|png|gif|webp)"' "$file" | sed 's/"url":"//g' | sed 's/"//g' >> /tmp/raw_urls.txt
            grep -Eoi '"image":"[^"]+\.(jpg|jpeg|png|gif|webp)"' "$file" | sed 's/"image":"//g' | sed 's/"//g' >> /tmp/raw_urls.txt
            grep -Eoi '"thumbnail":"[^"]+\.(jpg|jpeg|png|gif|webp)"' "$file" | sed 's/"thumbnail":"//g' | sed 's/"//g' >> /tmp/raw_urls.txt
            grep -Eoi 'data-thumbnail=["'"'"'][^"'"'"']+\.(jpg|jpeg|png|gif|webp)' "$file" | sed 's/data-thumbnail=["'"'"']//gi' >> /tmp/raw_urls.txt
            grep -Eoi 'poster=["'"'"'][^"'"'"']+\.(jpg|jpeg|png|gif|webp)' "$file" | sed 's/poster=["'"'"']//gi' >> /tmp/raw_urls.txt
            
            # الگوهای مخصوص CDN های معروف
            grep -Eoi '(cdn\d*\.cloudfront\.net|cdn\d*\.digitaloceanspaces\.com|cloudinary\.com|imgix\.net|akamaihd\.net)[^"'"'"']+\.(jpg|jpeg|png|gif|webp)' "$file" | sed 's/^/https:\/\//g' >> /tmp/raw_urls.txt
          done
          
          # پاکسازی و حذف تکراری
          sort -u /tmp/raw_urls.txt | grep -E '\.(jpg|jpeg|png|gif|webp|avif|svg)' | grep -v '^$' > /tmp/thumbnails.txt
          
          echo "📸 تعداد تامبنیل‌های پیدا شده: $(wc -l < /tmp/thumbnails.txt)"
          
          # دانلود همه تامبنیل‌ها
          mkdir -p ../thumbnails
          counter=1
          while IFS= read -r url; do
            if [ ! -z "$url" ]; then
              # ایجاد نام فایل یکتا
              extension=$(echo "$url" | grep -oE '\.(jpg|jpeg|png|gif|webp|avif|svg)' | head -1)
              filename="thumb_${counter}${extension}"
              
              echo "⬇️ [$counter] $(echo "$url" | cut -c1-80)..."
              wget --timeout=15 --tries=3 --quiet -O "../thumbnails/$filename" "$url" 2>/dev/null && echo "✅" || echo "❌"
              counter=$((counter+1))
            fi
          done < /tmp/thumbnails.txt
          
          cd ..

      - name: Scan HTML for lazy-loaded images
        run: |
          cd site
          
          # پیدا کردن اسکریپت‌های حاوی داده‌های JSON
          find . -name "*.js" -o -name "*.json" | while read file; do
            # استخراج لینک‌هایی که با lazy loading لود می‌شن
            grep -Eoi 'data-src=["'"'"'][^"'"'"']+' "$file" | sed 's/data-src=["'"'"']//g' >> /tmp/lazy_urls.txt
            grep -Eoi 'data-original=["'"'"'][^"'"'"']+' "$file" | sed 's/data-original=["'"'"']//g' >> /tmp/lazy_urls.txt
          done
          
          sort -u /tmp/lazy_urls.txt | grep -E '\.(jpg|jpeg|png|gif|webp)' > /tmp/lazy_images.txt
          
          while IFS= read -r url; do
            if [ ! -z "$url" ]; then
              filename=$(basename "$url" | cut -d'?' -f1)
              wget --timeout=10 --tries=2 --quiet -O "../thumbnails/$filename" "$url" 2>/dev/null || true
            fi
          done < /tmp/lazy_images.txt
          
          cd ..

      - name: Create HTML page with local thumbnails
        run: |
          cd site
          
          # پیدا کردن فایل HTML اصلی
          main_html=$(find . -maxdepth 2 -name "*.html" | head -1)
          
          if [ -f "$main_html" ]; then
            # ساختن نسخه پشتیبان
            cp "$main_html" "${main_html}.backup"
            
            # جایگزینی آدرس تامبنیل‌ها با عکس‌های محلی
            counter=1
            for thumb in ../thumbnails/*.jpg ../thumbnails/*.jpeg ../thumbnails/*.png ../thumbnails/*.webp 2>/dev/null; do
              if [ -f "$thumb" ]; then
                thumbname=$(basename "$thumb")
                # جایگزینی در فایل HTML (با الگوهای مختلف)
                sed -i "s|https?://[^\"]*thumb[^\"]*\.jpg|$thumbname|gi" "$main_html" 2>/dev/null || true
                sed -i "s|https?://[^\"]*thumbnail[^\"]*\.jpg|$thumbname|gi" "$main_html" 2>/dev/null || true
                sed -i "s|data-src=\"[^\"]*\.jpg\"|src=\"$thumbname\"|gi" "$main_html" 2>/dev/null || true
                counter=$((counter+1))
              fi
            done
          fi
          
          cd ..

      - name: Package everything
        run: |
          cat > HOW_TO_USE.txt << 'EOF'
          ========================================
          ✅ همه چیز آماده است!
          ========================================
          
          📁 پوشه‌های داخل فایل ZIP:
          - site/         : صفحه اصلی و فایل‌های CSS/JS
          - thumbnails/   : همه عکس‌های تامبنیل (کاور ویدیوها)
          
          📱 نحوه استفاده در اندروید:
          
          1. فایل کامل_page.zip رو دانلود کن
          2. با Zarchiver اکسترکت کن
          3. پوشه site رو باز کن
          4. فایل index.html یا .html رو پیدا کن
          5. با Chrome یا Firefox باز کن
          
          ✅ نکته: همه عکس‌های تامبنیل (حتی از CDN های مختلف) داخل پوشه thumbnails هستن
          ✅ صفحه کامل با همه استایل‌ها نمایش داده میشه
          ========================================
          EOF
          
          zip -r کامل_page.zip site/ thumbnails/ HOW_TO_USE.txt
          
          echo "📦 حجم فایل نهایی:"
          ls -lh کامل_page.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add site/ thumbnails/ کامل_page.zip HOW_TO_USE.txt
          git diff --staged --quiet || git commit -m "صفحه کامل + تامبنیل‌های همه CDN ها"
          git push

      - name: Show result
        run: |
          echo "=========================================="
          echo "✅ دانلود کامل شد!"
          echo ""
          echo "📥 دانلود فایل نهایی:"
          echo "https://github.com/${{ github.repository }}/tree/master/کامل_page.zip"
          echo ""
          echo "📂 تعداد عکس‌های تامبنیل ذخیره شده: $(ls thumbnails/ 2>/dev/null | wc -l) عدد"
          echo "=========================================="