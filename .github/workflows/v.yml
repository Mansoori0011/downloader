name: Find & Build Working Proxy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    
    - name: Install tools
      run: |
        wget -q https://github.com/XTLS/Xray-core/releases/download/v25.3.6/Xray-linux-64.zip
        unzip -q Xray-linux-64.zip
        chmod +x xray

    - name: Build Warp + Xray Chain
      run: |
        UUID=$(cat /proc/sys/kernel/random/uuid)
        
        # نصب WARP
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare.gpg
        echo "deb [arch=arm64 signed-by=/usr/share/keyrings/cloudflare.gpg] https://pkg.cloudflareclient.com/ bookworm main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        sudo apt-get update -qq
        sudo apt-get install -y -qq cloudflare-warp 2>/dev/null || echo "WARP failed"
        
        # اجرای WARP در صورت نصب
        if command -v warp-cli &> /dev/null; then
          sudo warp-cli registration new
          sudo warp-cli mode proxy
          sudo warp-cli proxy port 40000
          sudo warp-cli connect
          sleep 5
        fi
        
        # ساخت کانفیگ Xray با خروجی SOCKS5 به WARP
        cat > config.json << EOF
        {
          "inbounds": [{
            "port": 8080,
            "listen": "0.0.0.0",
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "$UUID"}],
              "decryption": "none"
            },
            "streamSettings": {"network": "tcp"}
          }],
          "outbounds": [{
            "protocol": "socks",
            "settings": {
              "servers": [{"address": "127.0.0.1", "port": 40000}]
            }
          }]
        }
        EOF
        
        ./xray run -config config.json &
        sleep 3
        
        PUBLIC_IP=$(curl -s ifconfig.me)
        
        VLESS="vless://$UUID@$PUBLIC_IP:8080?encryption=none&type=tcp#WARP-Chain"
        echo "$VLESS" > chain-config.txt
        
        echo "Push to repo..."
        git config user.name "actions"
        git config user.email "actions@github.com"
        git add chain-config.txt
        git commit -m "Update" || true
        git push

    - name: Wait (keep alive)
      run: sleep 12000