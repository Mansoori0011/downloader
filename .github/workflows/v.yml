name: "تست موقتی: ایجاد تونل با Cloudflare"
on:
  workflow_dispatch:  # با این گزینه، خودتان اجرا را شروع می‌کنید

jobs:
  create-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: نصب cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: اجرای یک سرویس نمونه (مثلاً وب سرور ساده)
        run: |
          # یک فایل HTML ساده برای تست ایجاد می‌کنیم
          echo "<h1>نمونه تست از GitHub Actions</h1>" > index.html
          # یک وب سرور ساده روی پورت 8080 راه می‌اندازیم
          python3 -m http.server 8080 &

      - name: ایجاد تونل Cloudflare
        id: tunnel
        uses: AnimMouse/setup-cloudflared/tunnel@v2
        with:
          url: http://localhost:8080  # پورتی که سرویس ما روش کار می‌کند

      - name: نمایش آدرس تونل (لینک دسترسی)
        run: |
          echo "✅ تونل با موفقیت برقرار شد."
          echo "🔗 آدرس عمومی شما: ${{ steps.tunnel.outputs.tunnel_url }}"
          echo "⏱ این تونل تا اتمام این مرحله (حدود ۶ ساعت) فعال خواهد بود."
          echo "👇 از این آدرس در اپلیکیشن‌های تست خود استفاده کنید."

      - name: نگه داشتن رانر برای تست
        run: sleep 7200  # رانر را به مدت ۲ ساعت روشن نگه می‌دارد (یا هر چقدر که نیاز دارید)