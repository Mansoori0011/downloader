stages:
  - get_ip
  - use_ip  # مرحله مثال برای استفاده از IP

# دریافت IP عمومی رانر
get_runner_ip:
  stage: get_ip
  script:
    # دریافت IPv4 (استفاده از ipify.org)
    - export CI_RUNNER_IP=$(curl -s https://api.ipify.org)
    - echo "آی پی عمومی رانر: $CI_RUNNER_IP"
  artifacts:
    reports:
      dotenv: runnet_ip.env  # خروجی به صورت متغیر محیطی ذخیره می‌شود

# مثال: استفاده از IP در مرحله بعد
use_ip_example:
  stage: use_ip
  needs: ["get_runner_ip"]  # صبر می‌کند مرحله قبل تمام شود
  script:
    - echo "آی پی ذخیره شده: $CI_RUNNER_IP"
    # مثال: قرار دادن در فایروال
    # - aws ec2 authorize-security-group-ingress --cidr $CI_RUNNER_IP/32
  dependencies:
    - get_runner_ip