name: Debug V2Ray Setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت IP
        id: get_ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$IP" >> $GITHUB_ENV
          echo "IP: $IP"

      - name: نصب Xray (گام به گام)
        run: |
          # دانلود اسکریپت نصب
          curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh -o install.sh
          cat install.sh | bash -s @ install
          echo "Xray installed, exit code: $?"

      - name: ساخت UUID
        id: uuid
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "UUID: $UUID"

      - name: ساخت کانفیگ
        run: |
          echo '{
            "inbounds": [
              {
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "'$UUID'"}],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {"path": "/ray"}
                }
              }
            ],
            "outbounds": [{"protocol": "freedom"}]
          }' | sudo tee /usr/local/etc/xray/config.json
          
          echo "Config created:"
          cat /usr/local/etc/xray/config.json

      - name: نصب و اجرا با screen
        run: |
          sudo apt update
          sudo apt install -y screen
          
          which xray
          ls -la /usr/local/bin/xray
          
          sudo screen -dmS xray bash -c '/usr/local/bin/xray run -c /usr/local/etc/xray/config.json 2>&1 | tee /tmp/xray.log'
          sleep 3
          
          echo "=== بررسی اجرا ==="
          ps aux | grep xray
          screen -list
          
          echo "=== لاگ Xray ==="
          cat /tmp/xray.log 2>/dev/null || echo "No log yet"

      - name: ساخت کانفیگ نهایی
        run: |
          echo "=== کانفیگ V2RayNG ===" > config.txt
          echo "vless://$UUID@${{ env.RUNNER_IP }}:8080?encryption=none&security=none&type=ws&path=%2Fray#GitHub-VPN" >> config.txt
          cat config.txt

      - name: ذخیره فایل
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.txt 2>/dev/null
          git diff --quiet && git diff --staged --quiet || git commit -m "debug config"
          git push