name: Screenshot Telegram Channel

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Puppeteer
        run: |
          npm init -y
          npm install puppeteer

      - name: Take screenshot of channel
        run: |
          cat > screenshot.js << 'EOF'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 480, height: 800 });

            await page.goto('https://t.me/s/AriyanProxy', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });

            await page.waitForSelector('.tgme_widget_message_wrap', { timeout: 15000 });

            const messages = await page.evaluate(() => {
              const wraps = document.querySelectorAll('.tgme_widget_message_wrap');
              const result = [];
              
              wraps.forEach(wrap => {
                const textEl = wrap.querySelector('.tgme_widget_message_text');
                const timeEl = wrap.querySelector('time');
                
                if (textEl && timeEl) {
                  const text = textEl.innerText.trim();
                  const date = timeEl.getAttribute('datetime') || timeEl.innerText;
                  result.push({ date, text });
                }
              });
              
              return result;
            });

            const fs = require('fs');
            const now = new Date();
            const cutoff = new Date(now - 2 * 24 * 60 * 60 * 1000);

            const recent = messages.filter(m => {
              try {
                return new Date(m.date) >= cutoff;
              } catch {
                return true;
              }
            });

            let output = `کانال AriyanProxy — ${now.toISOString()}\n`;
            output += '='.repeat(60) + '\n\n';
            output += `پیام‌های ۴۸ ساعت اخیر: ${recent.length}\n\n`;

            recent.forEach((m, i) => {
              output += `${m.date}\n`;
              output += m.text + '\n';
              output += '-'.repeat(40) + '\n\n';
            });

            fs.writeFileSync('telegram_messages.txt', output, 'utf8');
            console.log(`Saved ${recent.length} messages`);

            await page.screenshot({ path: 'channel_screenshot.png', fullPage: true });
            console.log('Screenshot saved');

            await browser.close();
          })();
          EOF

          node screenshot.js

      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add telegram_messages.txt channel_screenshot.png
          git commit -m "Update channel messages — $(date +%s)" || true
          git pull --rebase
          git push