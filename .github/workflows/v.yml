name: V2Ray Config with TLS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-v2ray:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت IP رانر
        id: get_ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$IP" >> $GITHUB_ENV
          echo "IP: $IP"

      - name: ساخت UUID تصادفی
        id: uuid
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "UUID: $UUID"

      - name: ساخت کانفیگ با TLS
        run: |
          # دامنه فیک برای SNI (مهم برای عبور از تحریم‌ها)
          SNI_HOST="dl.google.com"
          
          # ساخت لینک کانفیگ با فرمت دقیق نمونه شما
          CONFIG_URL="vless://$UUID@${{ env.RUNNER_IP }}:8443?path=%2F&security=tls&encryption=none&insecure=0&host=$SNI_HOST&fp=chrome&type=ws&allowInsecure=0&sni=$SNI_HOST#V2Ray-GitHub-Runner"
          
          echo "=========================================" > v2ray-config.txt
          echo "کانفیگ V2RayNG - کپی کنید:" >> v2ray-config.txt
          echo "=========================================" >> v2ray-config.txt
          echo "$CONFIG_URL" >> v2ray-config.txt
          echo "" >> v2ray-config.txt
          echo "جزئیات:" >> v2ray-config.txt
          echo "پروتکل: VLESS" >> v2ray-config.txt
          echo "پورت: 8443" >> v2ray-config.txt
          echo "امنیت: TLS" >> v2ray-config.txt
          echo "SNI: $SNI_HOST" >> v2ray-config.txt
          echo "Network: WebSocket" >> v2ray-config.txt
          echo "Path: /" >> v2ray-config.txt
          
          echo "✅ کانفیگ ساخته شد:"
          cat v2ray-config.txt
          
          echo "CONFIG_URL=$CONFIG_URL" >> $GITHUB_ENV

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2ray-config.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "v2ray tls config for ip ${{ env.RUNNER_IP }}"
          git push

      - name: نمایش لینک نهایی
        run: |
          echo "🔗 لینک کانفیگ شما:"
          echo "${{ env.CONFIG_URL }}"