name: "دانلود کامل سایت با تمام منابع"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس کامل سایت (با http:// یا https://)'
        required: true
        default: 'https://example.com'
      max_depth:
        description: 'عمق لینک‌های دنبال شود (۱ تا ۵)'
        required: true
        default: '2'

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🌐 Mirror entire website with wget
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          rm -rf ./mirrored-site
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=2 \
            --limit-rate=100k \
            --directory-prefix=./mirrored-site \
            --execute robots=off \
            --user-agent="Mozilla/5.0 (Android 14; Mobile) AppleWebKit/537.36" \
            "${{ github.event.inputs.site_url }}"

      - name: 📱 Create Android shortcut file
        run: |
          cat > ./mirrored-site/ANDROID_README.md << 'EOF'
# 📱 نحوه مشاهده این سایت در اندروید

## روش اول (ساده) 🟢
فایل اصلی سایت رو با مرورگر گوشی باز کن

## روش دوم (آفلاین کامل) 🔵
1. کل پوشه mirrored-site رو دانلود کن
2. دکمه Code → Download ZIP
3. فایل ZIP رو از حالت فشرده خارج کن
4. داخل پوشه، فایل index.html رو باز کن

✅ تمام منابع محلی ذخیره شده‌اند
EOF

      - name: 💾 Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add mirrored-site/
          git diff --staged --quiet || git commit -m "Mirror کامل: ${{ github.event.inputs.site_url }}"
          git push

      - name: ✅ نمایش لینک دسترسی
        run: |
          echo "=========================================="
          echo "✅ سایت با موفقیت دانلود شد"
          echo ""
          echo "🔗 لینک دسترسی:"
          echo "https://github.com/${{ github.repository }}/tree/main/mirrored-site"
          echo "=========================================="