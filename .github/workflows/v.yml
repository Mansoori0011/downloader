name: “دانلود کامل سایت با تمام منابع”

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: ‘آدرس کامل سایت (با http:// یا https://)’
        required: true
        default: ‘https://example.com’
      max_depth:
        description: ‘عمق لینک‌های دنبال شود (۱ تا ۵)’
        required: true
        default: ‘2’

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🌐 Mirror entire website with wget
        run: |
          # نصب wget
          sudo apt-get update
          sudo apt-get install -y wget

          # پاک کردن پوشه قبلی
          rm -rf ./mirrored-site

          # دانلود کامل سایت (عکس، CSS، JS، فونت و...)
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=2 \
            --limit-rate=100k \
            --directory-prefix=./mirrored-site \
            --execute robots=off \
            --user-agent="Mozilla/5.0 (Android 14; Mobile) AppleWebKit/537.36" \
            -e "https_proxy=${{ secrets.HTTPS_PROXY }}" \
            "${{ github.event.inputs.site_url }}"

          # بازسازی ساختار پوشه
          find ./mirrored-site -type f -name "*.html" -exec sh -c '
            for file; do
              mv "$file" "${file%.html}.html"
            done
          ' sh {} +

      - name: 📱 Create Android shortcut file
        run: |
          # ساخت فایل راهنما برای اندروید
          cat > ./mirrored-site/ANDROID_README.md << 'EOF'
# 📱 نحوه مشاهده این سایت در اندروید

## روش اول (ساده) 🟢
فایل اصلی سایت رو با مرورگر گوشی باز کن:
`index.html` یا نام فایل اصلی که دانلود شده

## روش دوم (آفلاین کامل) 🔵
1. کل پوشه `mirrored-site` رو دانلود کن:
   - برو به مخزن گیت‌هاب
   - دکمه `<> Code` → `Download ZIP`
2. فایل ZIP رو از حالت فشرده خارج کن
3. داخل پوشه، فایل `index.html` رو باز کن

## ساختار فایل‌ها
- 📄 HTML: تمام صفحات
- 🖼️ Images: عکس‌ها در پوشه‌های `images/` یا `img/`
- 🎨 CSS: فایل‌های استایل
- ⚙️ JS: اسکریپت‌ها

✅ تمام منابع محلی ذخیره شده‌اند (اینترنت نیاز نیست بعد از دانلود)
EOF

      - name: 💾 Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add mirrored-site/
          git diff --staged --quiet || git commit -m "📦 Mirror کامل: ${{ github.event.inputs.site_url }} - $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: ✅ نمایش لینک دسترسی
        run: |
          echo "=========================================="
          echo "✅ سایت با موفقیت دانلود شد!"
          echo ""
          echo "🔗 لینک دسترسی مستقم:"
          echo "https://github.com/${{ github.repository }}/tree/master/mirrored-site"
          echo ""
          echo "📱 روی گوشی:"
          echo "1. لینک بالا رو باز کن"
          echo "2. فایل index.html رو پیدا کن"
          echo "3. روش Raw یا Download رو بزن تا تو مرورگر گوشی باز بشه"
          echo "=========================================="