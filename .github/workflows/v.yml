name: Direct HTTP Proxy
on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Setup HTTP Proxy
        run: |
          sudo apt update
          sudo apt install -y dnsmasq tinyproxy

          # DNS داخلی
          echo "no-resolv" | sudo tee /etc/dnsmasq.d/proxy.conf
          echo "server=8.8.8.8" | sudo tee -a /etc/dnsmasq.d/proxy.conf
          echo "server=1.1.1.1" | sudo tee -a /etc/dnsmasq.d/proxy.conf
          echo "listen-address=127.0.0.1" | sudo tee -a /etc/dnsmasq.d/proxy.conf
          echo "bind-interfaces" | sudo tee -a /etc/dnsmasq.d/proxy.conf
          sudo systemctl restart dnsmasq

          # پروکسی HTTP
          sudo sed -i 's/^Allow 127.0.0.1/#/' /etc/tinyproxy/tinyproxy.conf
          sudo sed -i 's/^Allow ::1/#/' /etc/tinyproxy/tinyproxy.conf
          echo "Allow 0.0.0.0/0" | sudo tee -a /etc/tinyproxy/tinyproxy.conf
          echo "Listen 0.0.0.0" | sudo tee -a /etc/tinyproxy/tinyproxy.conf
          echo "Port 8080" | sudo tee -a /etc/tinyproxy/tinyproxy.conf
          sudo systemctl restart tinyproxy

      - name: Get Public IP
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me)
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV
          
          echo "========================================="
          echo "✅ PROXY READY!"
          echo "📱 v2rayNG Settings:"
          echo "   Type: HTTP"
          echo "   Server: $PUBLIC_IP"
          echo "   Port: 8080"
          echo "========================================="
          
          mkdir -p config
          echo "Type: HTTP" > config/proxy-config.txt
          echo "Server: $PUBLIC_IP" >> config/proxy-config.txt
          echo "Port: 8080" >> config/proxy-config.txt

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: proxy-config
          path: config/

      - name: Keep Alive
        run: sleep 21600