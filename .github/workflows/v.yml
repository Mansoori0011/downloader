name: Always-On Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - uses: actions/checkout@v4

    - name: Setup
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq curl wget jq
        npm init -y
        npm install puppeteer

    - name: Start Worker
      run: |
        cat > worker.sh << 'SHEOF'
        #!/bin/bash
        GIST_URL="https://api.github.com/gists/9975cf2a918cc9b28d212c28b5ec2cfd"
        LAST_ID=""
        
        while true; do
          COMMAND=$(curl -s "$GIST_URL" | jq -r '.files."command.txt".content // empty' 2>/dev/null)
          COMMAND_ID=$(echo "$COMMAND" | md5sum | cut -d' ' -f1)
          
          if [ -n "$COMMAND" ] && [ "$COMMAND_ID" != "$LAST_ID" ]; then
            echo "=== New command: $COMMAND ==="
            LAST_ID="$COMMAND_ID"
            
            ACTION=$(echo "$COMMAND" | cut -d'|' -f1)
            URL=$(echo "$COMMAND" | cut -d'|' -f2-)
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            case "$ACTION" in
              screenshot)
                cat > /tmp/scr.js << 'EOF'
        const puppeteer = require('puppeteer');
        (async () => {
          const b = await puppeteer.launch({headless:'new',args:['--no-sandbox']});
          const p = await b.newPage();
          await p.goto(process.argv[2], {waitUntil:'networkidle2',timeout:30000});
          await new Promise(r=>setTimeout(r,2000));
          await p.screenshot({path:'/tmp/output.png',fullPage:true});
          await b.close();
        })();
        EOF
                node /tmp/scr.js "$URL" 2>&1
                RESULT="✅ Screenshot done: $TIMESTAMP"
                ;;
                
              html)
                curl -sL -A "Mozilla/5.0" "$URL" -o /tmp/page.html
                RESULT="✅ HTML saved: $TIMESTAMP ($(wc -c < /tmp/page.html) bytes)"
                ;;
                
              video)
                sudo apt-get install -y -qq yt-dlp 2>/dev/null
                yt-dlp --no-playlist -f "best[height<=720]" -o "/tmp/video.%(ext)s" "$URL" 2>&1
                RESULT="✅ Video downloaded: $TIMESTAMP"
                ;;
                
              *)
                RESULT="❌ Unknown action: $ACTION. Use: screenshot, html, video"
                ;;
            esac
            
            curl -s -X PATCH \
              -H "Authorization: token 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" \
              -H "Content-Type: application/json" \
              -d "{\"files\":{\"result.txt\":{\"content\":\"$RESULT\"}}}" \
              "$GIST_URL" 2>/dev/null
            
            echo "Result: $RESULT"
            
            # Copy to repo
            mkdir -p "output/$TIMESTAMP"
            cp /tmp/output.png "output/$TIMESTAMP/" 2>/dev/null || true
            cp /tmp/page.html "output/$TIMESTAMP/" 2>/dev/null || true
            cp /tmp/video.* "output/$TIMESTAMP/" 2>/dev/null || true
            
            git config user.name "actions"
            git config user.email "actions@github.com"
            git add output/ 2>/dev/null || true
            git commit -m "Result: $ACTION $TIMESTAMP" 2>/dev/null || true
            git pull --rebase
            git push 2>/dev/null || true
          fi
          
          sleep 10
        done
        SHEOF
        
        chmod +x worker.sh
        ./worker.sh