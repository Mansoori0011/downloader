name: Fetch Telegram Channel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Install Puppeteer
      run: |
        npm init -y
        npm install puppeteer

    - name: Fetch Telegram Channel Content
      run: |
        cat > fetch.js << 'EOF'
        const puppeteer = require('puppeteer');
        const fs = require('fs');

        (async () => {
          const browser = await puppeteer.launch({
            headless: 'new',
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });

          const page = await browser.newPage();
          
          const messages = [];
          
          page.on('response', async (response) => {
            const url = response.url();
            if (url.includes('t.me/s/AriyanProxy')) {
              const text = await response.text();
              
              const msgRegex = /<div class="tgme_widget_message_text[^"]*"[^>]*>(.*?)<\/div>/gs;
              const dateRegex = /<time[^>]*datetime="([^"]*)"[^>]*>/gs;
              
              let match;
              const dates = [];
              while ((match = dateRegex.exec(text)) !== null) {
                dates.push(match[1]);
              }
              
              const msgs = [];
              while ((match = msgRegex.exec(text)) !== null) {
                msgs.push(match[1].replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, '').trim());
              }
              
              dates.forEach((d, i) => {
                if (msgs[i]) {
                  messages.push({ date: d, text: msgs[i] });
                }
              });
            }
          });

          await page.goto('https://t.me/s/AriyanProxy', {
            waitUntil: 'networkidle2',
            timeout: 30000
          });

          await page.waitForSelector('.tgme_widget_message_text', { timeout: 10000 });

          const now = new Date();
          const twoDaysAgo = new Date(now - 2 * 24 * 60 * 60 * 1000);

          const recentMessages = messages.filter(m => {
            const msgDate = new Date(m.date);
            return msgDate >= twoDaysAgo;
          });

          let output = `کانال AriyanProxy - ${now.toISOString()}\n`;
          output += '='.repeat(60) + '\n\n';

          recentMessages.forEach(m => {
            output += `[${m.date}] ${m.text}\n`;
            output += '-'.repeat(40) + '\n\n';
          });

          fs.writeFileSync('telegram_messages.txt', output, 'utf8');
          console.log(`Saved ${recentMessages.length} messages`);

          await browser.close();
        })();
        EOF

        node fetch.js

    - name: Push
      run: |
        git config user.name "actions"
        git config user.email "actions@github.com"
        git add telegram_messages.txt
        git commit -m "Update telegram messages $(date +%s)" || true
        git pull --rebase
        git push