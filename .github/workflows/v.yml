name: "ذخیره صفحه به صورت MHTML با کروم"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس صفحه مورد نظر (مثل سایتی که گفتی)'
        required: true
        default: 'https://example.com'

jobs:
  save-as-mhtml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 دریافت کدهای مخزن
        uses: actions/checkout@v4

      - name: 🐍 نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب کتابخانه‌های مورد نیاز برای کنترل کروم
        run: |
          pip install selenium webdriver-manager

      - name: 🌐 نصب و آماده‌سازی گوگل کروم
        run: |
          # نصب کروم
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y -qq
          rm google-chrome-stable_current_amd64.deb
          
          # نصب ChromeDriver برای کنترل کروم
          sudo apt-get install -y unzip xvfb libxi6 libgconf-2-4
          wget -q https://storage.googleapis.com/chrome-for-testing-public/latest/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      - name: 📸 ذخیره صفحه به عنوان MHTML با استفاده از اسکریپت پایتون
        run: |
          python3 - << EOF
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          # تنظیمات مرورگر کروم در حالت بی‌سر (بدون نمایش)
          chrome_options = Options()
          chrome_options.add_argument('--headless=new') # حالت بی‌سر جدید
          chrome_options.add_argument('--no-sandbox')
          chrome_options.add_argument('--disable-dev-shm-usage')
          chrome_options.add_argument('--disable-gpu')
          chrome_options.add_argument('--remote-debugging-port=9222')

          print("🚀 در حال راه‌اندازی مرورگر کروم...")
          driver = webdriver.Chrome(options=chrome_options)

          site_url = "${{ github.event.inputs.site_url }}"
          print(f"🌐 در حال بارگذاری صفحه: {site_url}")
          driver.get(site_url)

          # صبر می‌کنیم تا صفحه و عکس‌های تامبنیل کاملاً لود بشن (مخصوص سایت شما)
          print("⏳ در حال منتظر ماندن برای لود کامل عکس‌ها (چند ثانیه)...")
          time.sleep(15) # افزایش زمان برای لود تامبنیل‌ها با JS

          print("📄 در حال گرفتن خروجی MHTML...")
          # این دستور جادویی کار ذخیره MHTML رو انجام میده
          mhtml_data = driver.execute_cdp_cmd('Page.captureSnapshot', {})

          # ذخیره خروجی در فایل
          output_file = 'page_complete.mhtml'
          with open(output_file, 'w', encoding='utf-8') as f:
              f.write(mhtml_data['data'])

          print(f"✅ فایل با موفقیت ذخیره شد: {output_file} (حجم: {len(mhtml_data['data']) / 1024:.2f} KB)")
          driver.quit()
          EOF

      - name: 💾 ذخیره فایل MHTML در مخزن گیت‌هاب
        run: |
          # بررسی می‌کنیم که فایل ساخته شده
          if [ -f "page_complete.mhtml" ]; then
            echo "✅ فایل MHTML با موفقیت ساخته شد."
            mkdir -p output
            mv page_complete.mhtml output/
            
            # یک فایل راهنما برای اندروید می‌سازیم
            cat > output/README_ANDROID.txt << 'EOF'
            ========================================
            ✅ فایل MHTML با موفقیت تهیه شد!
            ========================================
            
            🔗 نحوه استفاده در اندروید:
            1. فایل page_complete.mhtml رو دانلود کن (لینک پایین)
            2. فایل رو با مرورگر کروم (یا فایرفاکس) باز کن
            3. تمام عکس‌ها و استایل‌ها درست مثل حالت آنلاین نمایش داده می‌شن!
            
            📍 نکته: این روش توسط خود مرورگر کروم انجام شده،
            بنابراین تمام منابع (حتی تامبنیل‌های سنگین) داخل این یک فایل هست.
            ========================================
            EOF
          else
            echo "❌ خطا: فایل MHTML ساخته نشد!"
            exit 1
          fi

      - name: ارسال به مخزن گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add output/
          git diff --staged --quiet || git commit -m "ذخیره صفحه به صورت MHTML: ${{ github.event.inputs.site_url }}"
          git push

      - name: نمایش لینک دانلود نهایی
        run: |
          echo "=========================================="
          echo "🎉 تمام! فایل MHTML مورد نظرت آماده است."
          echo ""
          echo "📥 لینک مستقیم دانلود فایل MHTML:"
          echo "https://github.com/${{ github.repository }}/tree/master/output/page_complete.mhtml"
          echo ""
          echo "📱 برای اندروید: روی لینک بالا بزن، فایل دانلود می‌شه."
          echo "   بعد با مرورگر کروم گوشیت بازش کن."
          echo "=========================================="