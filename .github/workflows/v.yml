name: V2Ray + Gist Tunnel

on:
  workflow_dispatch:

jobs:
  v2ray:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Download Xray
      run: |
        wget -q https://github.com/XTLS/Xray-core/releases/download/v25.3.6/Xray-linux-64.zip
        unzip -q Xray-linux-64.zip
        chmod +x xray

    - name: Start V2Ray and Update Gist
      run: |
        UUID=$(cat /proc/sys/kernel/random/uuid)
        PUBLIC_IP=$(curl -s --connect-timeout 10 ifconfig.me || curl -s --connect-timeout 10 icanhazip.com || curl -s --connect-timeout 10 ip.sb)
        
        cat > config.json << EOF
        {
          "inbounds": [{
            "port": 8080,
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "$UUID"}],
              "decryption": "none"
            },
            "streamSettings": {"network": "tcp"}
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF
        
        ./xray run -config config.json &
        sleep 3
        
        VLESS="vless://$UUID@$PUBLIC_IP:8080?encryption=none&type=tcp#GitHub-Actions"
        
        echo "کانفیگ: $VLESS"
        
        curl -s -X PATCH \
          -H "Authorization: token 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" \
          -H "Content-Type: application/json" \
          -d "{\"files\":{\"config.txt\":{\"content\":\"$VLESS\"}}}" \
          https://api.github.com/gists/9975cf2a918cc9b28d212c28b5ec2cfd
        
        sleep 20500
