name: Fetch Telegram Channel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Fetch using tg.i-c-a.su mirror
      run: |
        # روش ۱: RSS feed تلگرام
        curl -s -L -A "Mozilla/5.0" "https://t.me/s/AriyanProxy" -o raw.html
        
        # استخراج پیام‌ها با awk و sed
        grep -oP '<div class="tgme_widget_message_text[^"]*">.*?</div>' raw.html | \
          sed 's/<[^>]*>//g' | \
          sed 's/&[^;]*;//g' \
        > temp_messages.txt
        
        grep -oP '<time[^>]*datetime="[^"]*"' raw.html | \
          grep -oP 'datetime="[^"]*"' | \
          sed 's/datetime="//;s/"//' \
        > temp_dates.txt
        
        # ترکیب تاریخ و پیام - فقط ۲ روز اخیر
        now=$(date -u +%s)
        cutoff=$((now - 172800))  # 48 ساعت
        
        echo "📢 کانال AriyanProxy — $(date -u +%Y-%m-%d)" > telegram_messages.txt
        echo "══════════════════════════════════════════════════" >> telegram_messages.txt
        echo "" >> telegram_messages.txt
        
        paste temp_dates.txt temp_messages.txt | while IFS=$'\t' read -r date msg; do
          if [ -n "$date" ] && [ -n "$msg" ]; then
            msg_epoch=$(date -d "$date" +%s 2>/dev/null || echo 0)
            if [ "$msg_epoch" -ge "$cutoff" ]; then
              echo "🕒 $date" >> telegram_messages.txt
              echo "$msg" >> telegram_messages.txt
              echo "──────────────────────────────────────────────" >> telegram_messages.txt
              echo "" >> telegram_messages.txt
            fi
          fi
        done
        
        echo "تعداد پیام‌های ذخیره شده: $(grep -c '🕒' telegram_messages.txt)" >> telegram_messages.txt
        
        cat telegram_messages.txt

    - name: Push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add telegram_messages.txt raw.html 2>/dev/null || true
        git commit -m "📢 Update AriyanProxy — $(date +%s)" || true
        git pull --rebase
        git push