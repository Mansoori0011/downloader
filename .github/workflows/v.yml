name: Fetch Telegram Messages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup Puppeteer
      run: |
        npm init -y
        npm install puppeteer

    - name: Fetch with Redirect Block
      run: |
        cat > fetch.js << 'ENDOFSCRIPT'
        const puppeteer = require('puppeteer');
        const fs = require('fs');

        (async () => {
          const browser = await puppeteer.launch({
            headless: false,
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 1280, height: 720 });

          // بستن ریدایرکت به tg:// و web.telegram.org
          await page.setRequestInterception(true);
          page.on('request', (req) => {
            const url = req.url();
            if (url.startsWith('tg://') || url.includes('web.telegram.org')) {
              console.log('🚫 بلوکه شد:', url.substring(0, 80));
              req.abort();
            } else {
              req.continue();
            }
          });

          // تنظیم یه کوکی که فکر کنه قبلاً تأیید شده
          await page.setCookie({
            name: 'stel_dt',
            value: '1',
            domain: '.t.me',
            path: '/'
          });
          await page.setCookie({
            name: 'stel_ln',
            value: '2',
            domain: '.t.me',
            path: '/'
          });

          // رفتن به صفحه با پارامتر جلوگیری از ریدایرکت
          await page.goto('https://t.me/s/AriyanProxy?before=9999999999', {
            waitUntil: 'domcontentloaded',
            timeout: 30000
          });

          // صبر برای لود شدن پیام‌ها
          await new Promise(r => setTimeout(r, 3000));

          // اسکرول پایین
          await page.evaluate(() => {
            window.scrollBy(0, 3000);
          });
          await new Promise(r => setTimeout(r, 1500));
          await page.evaluate(() => {
            window.scrollBy(0, 5000);
          });
          await new Promise(r => setTimeout(r, 1500));

          // چک HTML
          const html = await page.content();
          const hasMessages = html.includes('tgme_widget_message');

          console.log('URL:', page.url());
          console.log('Has messages:', hasMessages);

          // ذخیره HTML برای دیباگ
          fs.writeFileSync('page.html', html);

          let messages = [];

          if (hasMessages) {
            messages = await page.evaluate(() => {
              const wrappers = document.querySelectorAll('.tgme_widget_message_wrap');
              const result = [];
              wrappers.forEach(wrap => {
                const textEl = wrap.querySelector('.tgme_widget_message_text');
                const timeEl = wrap.querySelector('time.datetime');
                if (textEl && timeEl) {
                  result.push({
                    datetime: timeEl.getAttribute('datetime'),
                    text: textEl.innerText.trim()
                  });
                }
              });
              return result;
            });
          } else {
            // شاید HTML با method دیگه لود شده
            const altContent = await page.evaluate(() => {
              return document.body.innerText.substring(0, 2000);
            });
            console.log('Body text sample:', altContent.substring(0, 500));
          }

          const now = new Date();
          const twoDaysAgo = new Date(now - 2 * 24 * 60 * 60 * 1000);

          const recent = messages.filter(m => new Date(m.datetime) >= twoDaysAgo);

          let output = `📢 کانال AriyanProxy\n`;
          output += `📅 تاریخ: ${now.toISOString().split('T')[0]}\n`;
          output += `📝 پیام‌های ۴۸ ساعت اخیر: ${recent.length}\n`;
          output += `🔍 کل پیام‌ها: ${messages.length}\n`;
          output += `═`.repeat(55) + `\n\n`;

          if (recent.length > 0) {
            recent.forEach(m => {
              output += `🕒 ${m.datetime}\n`;
              output += `${m.text}\n`;
              output += `─`.repeat(45) + `\n\n`;
            });
          } else if (messages.length > 0) {
            output += `⚠️ پیام‌های اخیر پیدا نشد. ولی ${messages.length} پیام قدیمی‌تر هست.\n\n`;
            output += `نمونه:\n`;
            messages.slice(0, 3).forEach(m => {
              output += `🕒 ${m.datetime}: ${m.text.substring(0, 150)}...\n\n`;
            });
          } else {
            output += `❌ هیچ پیامی استخراج نشد.\n`;
            output += `💡 توی page.html می‌تونی محتوای واقعی رو ببینی.\n`;
          }

          fs.writeFileSync('telegram_messages.txt', output, 'utf8');
          console.log(output);

          await browser.close();
        })();
        ENDOFSCRIPT

        node fetch.js

    - name: Push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add telegram_messages.txt page.html 2>/dev/null || true
        git commit -m "📢 AriyanProxy — $(date +%s)" || true
        git pull --rebase
        git push