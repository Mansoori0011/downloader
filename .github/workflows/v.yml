name: Temporary VPS with Panel

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Create temporary VPS container
        run: |
          echo "⏳ Creating temporary VPS (will run for 3 hours)..."
          docker run -d \
            --name temp-vps \
            --restart no \
            -p 80:80 \
            -p 443:443 \
            -p 54321:54321 \
            ubuntu:22.04 \
            sleep 10800

      - name: Install dependencies inside VPS
        run: |
          docker exec temp-vps bash -c "apt-get update && apt-get install -y curl wget ufw socat"

      - name: Install 3x-UI Panel
        run: |
          docker exec temp-vps bash -c 'curl -fsSL https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | bash'

      - name: Get Access Information
        run: |
          echo "═══════════════════════════════════════════"
          echo "✅ VPS is READY for 3 hours!"
          echo "═══════════════════════════════════════════"
          echo ""
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' temp-vps)
          echo "🌐 Panel Access: http://$CONTAINER_IP:54321"
          echo "🔑 Login: admin / admin"
          echo ""
          echo "📡 Enter container: docker exec -it temp-vps bash"
          echo "⏰ Auto-delete in 3 hours"
          echo "═══════════════════════════════════════════"

      - name: Keep VPS alive
        run: sleep 10800

      - name: Cleanup
        if: always()
        run: |
          docker stop temp-vps || true
          docker rm temp-vps || true
          echo "✅ VPS deleted"