name: Direct IP VPN

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Download Xray
      run: |
        wget -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip xray.zip
        chmod +x xray

    - name: Get Public IP and Run
      run: |
        UUID=$(cat /proc/sys/kernel/random/uuid)
        PORT=$(shuf -i 10000-60000 -n 1)
        PUBLIC_IP=$(curl -s ifconfig.me)
        
        cat > config.json << EOF
        {
          "inbounds": [{
            "port": $PORT,
            "listen": "0.0.0.0",
            "protocol": "vless",
            "settings": {
              "clients": [{ "id": "$UUID" }],
              "decryption": "none"
            },
            "streamSettings": {
              "network": "tcp"
            }
          }],
          "outbounds": [{ "protocol": "freedom" }]
        }
        EOF
        
        ./xray run -config config.json &
        sleep 2
        
        echo "=============================="
        echo "vless://$UUID@$PUBLIC_IP:$PORT?encryption=none&security=none&type=tcp#GitHub-Direct"
        echo "=============================="
        
        sleep 21000