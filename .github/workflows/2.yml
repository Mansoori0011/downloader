name: 🎬 استخراج لینک فیلم‌ها + اسکرین‌شات + فایل پویا

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'آدرس صفحه (مثل صفحه اصلی یا صفحه دسته‌بندی)'
        required: true
        type: string
        default: 'https://www.example.com'

jobs:
  extract-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: نصب ابزارهای مورد نیاز
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip3 install yt-dlp
          npm init -y
          npm install puppeteer

      - name: ساخت اسکریپت استخراج لینک‌ها (اصلاح شده)
        run: |
          cat > extract.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          
          (async () => {
            const url = process.argv[2];
            const outputFile = process.argv[3];
            
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            
            const page = await browser.newPage();
            
            // تنظیم User-Agent واقعی
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36');
            
            const videoUrls = new Set();
            const pageVideoLinks = [];
            
            // مانیتور کردن درخواست‌های شبکه
            page.on('request', request => {
              const requestUrl = request.url();
              if (requestUrl.match(/\.(mp4|m3u8|ts|flv|webm|mkv|avi|mov)(\?|$)/i) ||
                  requestUrl.match(/\/video\//i) ||
                  requestUrl.match(/\/get_file\//i) ||
                  requestUrl.match(/\/hls\//i) ||
                  requestUrl.match(/\/view_video\.php/i) ||
                  requestUrl.match(/\/embed\//i) ||
                  requestUrl.match(/\/v\//i)) {
                videoUrls.add(requestUrl);
                console.log('Found URL:', requestUrl.substring(0, 100));
              }
            });
            
            console.log('Loading page:', url);
            
            // افزایش زمان بارگذاری
            await page.goto(url, { 
              waitUntil: 'networkidle2', 
              timeout: 120000 
            });
            
            // انتظار برای لود شدن کامل
            await page.waitForTimeout(5000);
            
            // اسکرول بیشتر برای لود شدن همه محتوا
            console.log('Scrolling page...');
            for (let i = 0; i < 10; i++) {
              await page.evaluate(() => {
                window.scrollBy(0, window.innerHeight);
              });
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            
            // انتظار برای بارگذاری مجدد
            await page.waitForTimeout(3000);
            
            // استخراج لینک‌ها از المنت‌های مختلف
            const links = await page.$$eval('a, video, source, iframe', (elements) => {
              const results = [];
              elements.forEach(el => {
                const tagName = el.tagName.toLowerCase();
                let href = '';
                let title = '';
                
                if (tagName === 'a') {
                  href = el.href;
                  title = el.innerText?.trim() || el.title || '';
                } else if (tagName === 'video') {
                  href = el.src || el.getAttribute('src');
                  title = el.getAttribute('title') || 'Video';
                } else if (tagName === 'source') {
                  href = el.src;
                  title = 'Source';
                } else if (tagName === 'iframe') {
                  href = el.src;
                  title = el.getAttribute('title') || 'Iframe';
                }
                
                if (href && href !== '' && !href.startsWith('javascript:')) {
                  results.push({
                    url: href,
                    title: title.substring(0, 100)
                  });
                }
              });
              return results;
            });
            
            // فیلتر لینک‌های ویدیویی
            const videoPatterns = [
              /view_video\.php/i, /\/video\//i, /\/watch/i, /\/v\//i,
              /\/embed\//i, /\.mp4/i, /\.m3u8/i, /\.ts/i, /player/i
            ];
            
            const filteredLinks = links.filter(link => {
              return videoPatterns.some(pattern => pattern.test(link.url));
            });
            
            filteredLinks.forEach(link => pageVideoLinks.push(link));
            
            await browser.close();
            
            const result = {
              sourceUrl: url,
              timestamp: new Date().toISOString(),
              networkVideoUrls: Array.from(videoUrls),
              pageVideoLinks: pageVideoLinks
            };
            
            fs.writeFileSync(outputFile, JSON.stringify(result, null, 2));
            console.log('\n========================================');
            console.log('نتایج:');
            console.log('========================================');
            console.log('لینک‌های یافت شده از شبکه:', videoUrls.size);
            console.log('لینک‌های صفحات فیلم:', pageVideoLinks.length);
            console.log('========================================');
            
          })().catch(err => {
            console.error('Error:', err.message);
            process.exit(1);
          });
          EOF

      - name: اجرای اسکریپت و استخراج لینک‌ها
        run: |
          PAGE_URL="${{ github.event.inputs.page_url }}"
          
          # حذف پوشه قبلی و ایجاد پوشه جدید file
          rm -rf file 2>/dev/null || true
          mkdir -p file/screenshots
          
          echo "در حال استخراج لینک‌ها از: $PAGE_URL"
          node extract.js "$PAGE_URL" "file/extracted_links.json"
          
          # بررسی وجود فایل JSON
          if [ ! -f "file/extracted_links.json" ]; then
            echo "❌ خطا: فایل extracted_links.json ساخته نشد"
            exit 1
          fi
          
          VIDEO_COUNT=$(cat "file/extracted_links.json" | jq -r '.pageVideoLinks | length' 2>/dev/null || echo "0")
          DIRECT_COUNT=$(cat "file/extracted_links.json" | jq -r '.networkVideoUrls | length' 2>/dev/null || echo "0")
          
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 نتایج اولیه:"
          echo "═══════════════════════════════════════════════════════════"
          echo "لینک‌های صفحات فیلم: $VIDEO_COUNT"
          echo "لینک‌های مستقیم: $DIRECT_COUNT"
          echo "═══════════════════════════════════════════════════════════"
          
          # اگر لینک مستقیم وجود نداشت، از لینک‌های صفحات فیلم استفاده کن
          if [ "$DIRECT_COUNT" -eq 0 ]; then
            echo "⚠️ هیچ لینک مستقیمی پیدا نشد، از لینک‌های صفحات فیلم استفاده می‌شود"
          fi
          
          # ایجاد فایل video_links.txt (مثل کد شما)
          echo "═══════════════════════════════════════════════════════════" > "file/video_links.txt"
          echo "لیست لینک‌های فیلم‌ها" >> "file/video_links.txt"
          echo "آدرس صفحه: $PAGE_URL" >> "file/video_links.txt"
          echo "تاریخ: $(date)" >> "file/video_links.txt"
          echo "═══════════════════════════════════════════════════════════" >> "file/video_links.txt"
          echo "" >> "file/video_links.txt"
          
          # لینک‌های مستقیم
          if [ "$DIRECT_COUNT" -gt 0 ]; then
            echo "🎬 لینک‌های مستقیم پیدا شده:" >> "file/video_links.txt"
            echo "════════════════════════════════════" >> "file/video_links.txt"
            cat "file/extracted_links.json" | jq -r '.networkVideoUrls[]?' 2>/dev/null >> "file/video_links.txt"
            echo "" >> "file/video_links.txt"
            echo "" >> "file/video_links.txt"
          fi
          
          # لینک‌های صفحات فیلم (مثل کد شما)
          echo "📄 لینک‌های صفحات فیلم:" >> "file/video_links.txt"
          echo "═══════════════════════════════════════════════════════════" >> "file/video_links.txt"
          cat "file/extracted_links.json" | jq -r '.pageVideoLinks[] | "عنوان: \(.title)\nلینک: \(.url)\n---"' 2>/dev/null >> "file/video_links.txt"
          
          # ذخیره لینک‌های صفحات فیلم
          cat "file/extracted_links.json" | jq -r '.pageVideoLinks[] | .url' 2>/dev/null > "file/video_pages.txt"
          
          # دریافت اطلاعات دقیق فیلم‌ها با yt-dlp
          if [ "$VIDEO_COUNT" -gt 0 ]; then
            echo "در حال دریافت اطلاعات دقیق فیلم‌ها..."
            echo "[" > "file/videos_info.json"
            
            COUNTER=0
            while IFS= read -r url; do
              COUNTER=$((COUNTER + 1))
              echo "دریافت اطلاعات فیلم $COUNTER از $VIDEO_COUNT..."
              
              TITLE=$(yt-dlp --get-title "$url" 2>/dev/null || echo "فیلم $COUNTER")
              DURATION=$(yt-dlp --get-duration "$url" 2>/dev/null || echo "نامشخص")
              THUMBNAIL=$(yt-dlp --get-thumbnail "$url" 2>/dev/null || echo "")
              
              FORMATS=$(yt-dlp -F "$url" 2>/dev/null | grep -E '^[0-9]+' | awk '{print $2}' | grep -E '[0-9]+p' | sort -u | tr '\n' ',' | sed 's/,$//')
              if [ -z "$FORMATS" ]; then
                FORMATS="best"
              fi
              
              cat >> "file/videos_info.json" << EOF
              {
                "index": $COUNTER,
                "title": "$TITLE",
                "url": "$url",
                "duration": "$DURATION",
                "thumbnail": "$THUMBNAIL",
                "qualities": "$FORMATS"
              },
              EOF
            done < "file/video_pages.txt"
            
            sed -i '$ s/,$//' "file/videos_info.json"
            echo "]" >> "file/videos_info.json"
          else
            echo "[]" > "file/videos_info.json"
          fi

      - name: گرفتن اسکرین‌شات
        run: |
          PAGE_URL="${{ github.event.inputs.page_url }}"
          
          cat > screenshot.js << 'JSEOF'
          const puppeteer = require('puppeteer');
          const url = process.argv[2];
          const output = process.argv[3];
          (async () => {
              const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 720 });
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
              await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
              await page.screenshot({ path: output, fullPage: true });
              await browser.close();
          })();
          JSEOF
          
          node screenshot.js "$PAGE_URL" "file/screenshots/fullpage.png"
          echo "✅ اسکرین‌شات گرفته شد"

      - name: ایجاد فایل YAML پویا برای دانلود
        run: |
          TOTAL_VIDEOS=$(cat "file/videos_info.json" | jq '. | length' 2>/dev/null || echo "0")
          
          if [ "$TOTAL_VIDEOS" -eq 0 ]; then
            echo "⚠️ هیچ فیلمی برای دانلود وجود ندارد"
            exit 0
          fi
          
          cat > .github/workflows/download-selected-video.yml << 'WFEOF'
          name: 📥 دانلود فیلم انتخابی
          
          on:
            workflow_dispatch:
              inputs:
                video_index:
                  description: 'شماره فیلم مورد نظر'
                  required: true
                  type: choice
                  options:
          WFEOF
          
          for i in $(seq 1 $TOTAL_VIDEOS); do
            TITLE=$(cat "file/videos_info.json" | jq -r ".[$((i-1))].title" | cut -c1-50)
            echo "                    - '$i - $TITLE'" >> .github/workflows/download-selected-video.yml
          done
          
          cat >> .github/workflows/download-selected-video.yml << 'WFEOF'
            
            jobs:
              download:
                runs-on: ubuntu-latest
                permissions:
                  contents: write
                steps:
                  - uses: actions/checkout@v4
                  - name: نصب yt-dlp
                    run: pip3 install yt-dlp
                  - name: دانلود فیلم
                    run: |
                      VIDEO_INFO=$(cat "file/videos_info.json")
                      INDEX="${{ github.event.inputs.video_index }}"
                      VIDEO_NUMBER=$(echo "$INDEX" | cut -d' ' -f1)
                      VIDEO_URL=$(echo "$VIDEO_INFO" | jq -r ".[$((VIDEO_NUMBER-1))].url")
                      VIDEO_TITLE=$(echo "$VIDEO_INFO" | jq -r ".[$((VIDEO_NUMBER-1))].title")
                      echo "در حال دانلود: $VIDEO_TITLE"
                      yt-dlp -f best -o "video_${VIDEO_NUMBER}.mp4" "$VIDEO_URL"
                  - name: آپلود فایل
                    uses: actions/upload-artifact@v4
                    with:
                      name: downloaded-video
                      path: video_*.mp4
          WFEOF
          
          echo "✅ فایل پویا ایجاد شد"

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add file/
          git add .github/workflows/download-selected-video.yml 2>/dev/null || true
          git commit -m "استخراج فیلم‌ها از ${{ github.event.inputs.page_url }}" || echo "تغییری وجود ندارد"
          git push || echo "خطا در ارسال"

      - name: نمایش نتایج
        run: |
          VIDEO_COUNT=$(cat "file/extracted_links.json" 2>/dev/null | jq -r '.pageVideoLinks | length' || echo "0")
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ استخراج با موفقیت انجام شد!"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "📁 پوشه نتایج: file/"
          echo "🎬 تعداد لینک‌های فیلم: $VIDEO_COUNT"
          echo "📸 اسکرین‌شات: file/screenshots/fullpage.png"
          echo ""
          echo "═══════════════════════════════════════════════════════════"