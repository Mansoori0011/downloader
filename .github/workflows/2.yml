name: 🎬 استخراج لینک فیلم‌ها + اسکرین‌شات + فایل پویا

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'آدرس صفحه'
        required: true
        type: string

jobs:
  extract-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip3 install yt-dlp
          npm init -y
          npm install puppeteer

      - name: استخراج لینک‌ها با puppeteer
        run: |
          cat > extract.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          (async () => {
            const url = process.argv[2];
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0');
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
            await sleep(3000);
            const links = await page.$$eval('a', els => els.map(a => ({ url: a.href, title: a.innerText?.trim() || '' })));
            await browser.close();
            const videoLinks = links.filter(l => l.url && (l.url.includes('/view_video.php') || l.url.includes('/video/') || l.url.includes('/watch')));
            fs.writeFileSync(process.argv[3], JSON.stringify(videoLinks, null, 2));
            console.log('Found:', videoLinks.length);
          })();
          EOF
          PAGE_URL="${{ github.event.inputs.page_url }}"
          rm -rf file && mkdir -p file/screenshots
          node extract.js "$PAGE_URL" "file/video_pages.json"
          cat file/video_pages.json | jq -r '.[].url' > file/video_pages.txt
          cat file/video_pages.json | jq -r '.[] | "عنوان: " + .title + "\nلینک: " + .url + "\n---"' > file/video_links.txt

      - name: دریافت اطلاعات فیلم (10 ترد همزمان)
        run: |
          cd file
          TOTAL=$(cat video_pages.txt | wc -l)
          echo "در حال دریافت $TOTAL فیلم با 10 ترد..."
          
          mkdir -p /tmp/data
          process() {
            url="$1"
            idx="$2"
            title=$(yt-dlp --get-title "$url" 2>/dev/null | head -c 80)
            duration=$(yt-dlp --get-duration "$url" 2>/dev/null)
            title=${title:-"فیلم $idx"}
            duration=${duration:-"نامشخص"}
            echo "{\"index\":$idx,\"title\":\"$title\",\"url\":\"$url\",\"duration\":\"$duration\"}" > "/tmp/data/$idx.json"
          }
          export -f process
          cat -n video_pages.txt | xargs -P 10 -I {} bash -c 'process "$(echo {})"'
          
          echo "[" > videos_info.json
          for f in $(ls -1 /tmp/data/*.json 2>/dev/null | sort -t/ -k5 -n); do
            cat "$f" >> videos_info.json && echo "," >> videos_info.json
          done
          sed -i '$ s/,$//' videos_info.json && echo "]" >> videos_info.json
          rm -rf /tmp/data
          
          COUNT=$(cat videos_info.json | jq '. | length')
          echo "✅ $COUNT فیلم دریافت شد"
          cd ..

      - name: اسکرین‌شات
        run: |
          cat > ss.js << 'EOF'
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });
            await page.goto(process.argv[2], { waitUntil: 'networkidle2' });
            await page.screenshot({ path: process.argv[3], fullPage: true });
            await browser.close();
          })();
          EOF
          node ss.js "${{ github.event.inputs.page_url }}" "file/screenshots/fullpage.png"

      - name: فایل README
        run: |
          COUNT=$(cat file/videos_info.json | jq '. | length')
          cat > file/README.md << EOF
          # نتایج
          - **آدرس**: ${{ github.event.inputs.page_url }}
          - **تعداد**: $COUNT فیلم
          ![](./screenshots/fullpage.png)
          EOF

      - name: فایل پویا دانلود
        run: |
          TOTAL=$(cat file/videos_info.json | jq '. | length')
          mkdir -p .github/workflows
          cat > .github/workflows/download-video.yml << YEOF
          name: دانلود فیلم
          on:
            workflow_dispatch:
              inputs:
                num:
                  description: 'شماره فیلم (1-$TOTAL)'
                  required: true
                  type: string
          jobs:
            download:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: pip3 install yt-dlp
                - run: |
                    INFO=\$(cat file/videos_info.json)
                    N="\${{ github.event.inputs.num }}"
                    URL=\$(echo "\$INFO" | jq -r ".[\$((N-1))].url")
                    yt-dlp -f best -o "video_\${N}.mp4" "\$URL"
                - uses: actions/upload-artifact@v4
                  with:
                    name: video
                    path: video_*.mp4
          YEOF

      - name: ذخیره در مخزن
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull origin ${{ github.ref_name }} --rebase || true
          git add file/ .github/workflows/download-video.yml
          git diff --staged --quiet || git commit -m "استخراج فیلم"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && break || git pull origin ${{ github.ref_name }} --rebase
          done

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-data
          path: file/

      - name: نمایش نتیجه
        run: |
          COUNT=$(cat file/videos_info.json | jq '. | length')
          echo "✅ $COUNT فیلم - زمان: حدود 2-3 دقیقه"