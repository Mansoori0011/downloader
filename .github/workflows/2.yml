name: 🎬 استخراج لینک فیلم‌ها + اسکرین‌شات + فایل پویا

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'آدرس صفحه (مثل صفحه اصلی یا صفحه دسته‌بندی)'
        required: true
        type: string
        default: 'https://www.example.com'

jobs:
  extract-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب ابزارهای مورد نیاز
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq parallel
          pip3 install yt-dlp
          npm init -y
          npm install puppeteer

      - name: ساخت اسکریپت استخراج لینک
        run: |
          echo 'const puppeteer = require("puppeteer");' > extract.js
          echo 'const fs = require("fs");' >> extract.js
          echo 'function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }' >> extract.js
          echo '(async () => {' >> extract.js
          echo '  const url = process.argv[2];' >> extract.js
          echo '  const outputFile = process.argv[3];' >> extract.js
          echo '  const browser = await puppeteer.launch({ headless: "new", args: ["--no-sandbox", "--disable-setuid-sandbox"] });' >> extract.js
          echo '  const page = await browser.newPage();' >> extract.js
          echo '  await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36");' >> extract.js
          echo '  const videoUrls = new Set();' >> extract.js
          echo '  const pageVideoLinks = [];' >> extract.js
          echo '  page.on("request", request => {' >> extract.js
          echo '    const requestUrl = request.url();' >> extract.js
          echo '    if (requestUrl.match(/\.(mp4|m3u8|ts|flv)(\?|$)/i) || requestUrl.match(/\/view_video\.php/i)) {' >> extract.js
          echo '      videoUrls.add(requestUrl);' >> extract.js
          echo '    }' >> extract.js
          echo '  });' >> extract.js
          echo '  console.log("Loading page:", url);' >> extract.js
          echo '  await page.goto(url, { waitUntil: "networkidle2", timeout: 120000 });' >> extract.js
          echo '  await sleep(5000);' >> extract.js
          echo '  console.log("Scrolling page...");' >> extract.js
          echo '  for (let i = 0; i < 10; i++) {' >> extract.js
          echo '    await page.evaluate(() => { window.scrollBy(0, window.innerHeight); });' >> extract.js
          echo '    await sleep(2000);' >> extract.js
          echo '  }' >> extract.js
          echo '  const links = await page.$$eval("a", (elements) => {' >> extract.js
          echo '    const results = [];' >> extract.js
          echo '    elements.forEach(a => {' >> extract.js
          echo '      const href = a.href;' >> extract.js
          echo '      if (href && (href.includes("/view_video.php") || href.includes("/video/") || href.includes("/watch"))) {' >> extract.js
          echo '        results.push({ url: href, title: a.innerText?.trim() || a.title || "بدون عنوان" });' >> extract.js
          echo '      }' >> extract.js
          echo '    });' >> extract.js
          echo '    return results;' >> extract.js
          echo '  });' >> extract.js
          echo '  links.forEach(link => pageVideoLinks.push(link));' >> extract.js
          echo '  await browser.close();' >> extract.js
          echo '  const result = { sourceUrl: url, timestamp: new Date().toISOString(), networkVideoUrls: Array.from(videoUrls), pageVideoLinks: pageVideoLinks };' >> extract.js
          echo '  fs.writeFileSync(outputFile, JSON.stringify(result, null, 2));' >> extract.js
          echo '  console.log("Found:", pageVideoLinks.length, "video links");' >> extract.js
          echo '})().catch(err => { console.error("Error:", err.message); process.exit(1); });' >> extract.js

      - name: اجرای اسکریپت و استخراج لینک
        run: |
          PAGE_URL="${{ github.event.inputs.page_url }}"
          rm -rf file || true
          mkdir -p file/screenshots
          echo "در حال استخراج لینک از: $PAGE_URL"
          node extract.js "$PAGE_URL" "file/extracted_links.json"
          
          VIDEO_COUNT=$(cat file/extracted_links.json | jq -r '.pageVideoLinks | length' 2>/dev/null || echo "0")
          echo "تعداد فیلم‌های پیدا شده: $VIDEO_COUNT"
          
          echo "═══════════════════════════════════════════════════════════" > file/video_links.txt
          echo "لیست لینک‌های فیلم" >> file/video_links.txt
          echo "آدرس: $PAGE_URL" >> file/video_links.txt
          echo "تاریخ: $(date)" >> file/video_links.txt
          echo "═══════════════════════════════════════════════════════════" >> file/video_links.txt
          echo "" >> file/video_links.txt
          
          cat file/extracted_links.json | jq -r '.pageVideoLinks[] | "عنوان: " + .title + "\nلینک: " + .url + "\n---"' 2>/dev/null >> file/video_links.txt
          cat file/extracted_links.json | jq -r '.pageVideoLinks[] | .url' 2>/dev/null > file/video_pages.txt

      - name: دریافت اطلاعات فیلم (حلقه ساده با پیشرفت)
  run: |
    cd file
    TOTAL=$(cat video_pages.txt | wc -l)
    echo "در حال دریافت اطلاعات $TOTAL فیلم..."
    
    echo "[" > videos_info.json
    COUNTER=0
    while IFS= read -r url; do
      COUNTER=$((COUNTER + 1))
      echo "دریافت اطلاعات فیلم $COUNTER از $TOTAL"
      
      TITLE=$(yt-dlp --get-title "$url" 2>/dev/null | head -c 100)
      DURATION=$(yt-dlp --get-duration "$url" 2>/dev/null)
      TITLE=${TITLE:-"فیلم $COUNTER"}
      DURATION=${DURATION:-"نامشخص"}
      
      echo "  {\"index\":$COUNTER,\"title\":\"$TITLE\",\"url\":\"$url\",\"duration\":\"$DURATION\"}," >> videos_info.json
    done < video_pages.txt
    
    # حذف کامای آخر و بستن JSON
    sed -i '$ s/,$//' videos_info.json
    echo "]" >> videos_info.json
    
    COUNT=$(cat videos_info.json | jq '. | length')
    echo "✅ اطلاعات $COUNT فیلم دریافت شد"
    cd ..

      - name: گرفتن اسکرین‌شات
        run: |
          PAGE_URL="${{ github.event.inputs.page_url }}"
          echo 'const puppeteer = require("puppeteer");' > screenshot.js
          echo '(async () => {' >> screenshot.js
          echo '  const browser = await puppeteer.launch({ headless: "new", args: ["--no-sandbox"] });' >> screenshot.js
          echo '  const page = await browser.newPage();' >> screenshot.js
          echo '  await page.setViewport({ width: 1280, height: 720 });' >> screenshot.js
          echo '  await page.goto(process.argv[2], { waitUntil: "networkidle2" });' >> screenshot.js
          echo '  await page.screenshot({ path: process.argv[3], fullPage: true });' >> screenshot.js
          echo '  await browser.close();' >> screenshot.js
          echo '})();' >> screenshot.js
          node screenshot.js "$PAGE_URL" "file/screenshots/fullpage.png"
          echo "اسکرین‌شات گرفته شد"

      - name: ایجاد فایل README
        run: |
          VIDEO_COUNT=$(cat file/videos_info.json | jq '. | length' 2>/dev/null || echo "0")
          cat > file/README.md << EOL
          # نتایج استخراج فیلم
          - **آدرس**: ${{ github.event.inputs.page_url }}
          - **تاریخ**: $(date)
          - **تعداد فیلم‌ها**: $VIDEO_COUNT
          ## اسکرین‌شات
          ![اسکرین‌شات](./screenshots/fullpage.png)
          ## فایل‌ها
          - [video_links.txt](./video_links.txt)
          - [video_pages.txt](./video_pages.txt)
          - [videos_info.json](./videos_info.json)
          EOL

      - name: ایجاد فایل YAML پویا برای دانلود
        run: |
          TOTAL_VIDEOS=$(cat file/videos_info.json | jq '. | length' 2>/dev/null || echo "0")
          mkdir -p .github/workflows
          cat > .github/workflows/download-video.yml << 'YEOF'
          name: دانلود فیلم انتخابی
          on:
            workflow_dispatch:
              inputs:
                video_number:
                  description: 'شماره فیلم (1 تا TOTAL)'
                  required: true
                  type: string
          jobs:
            download:
              runs-on: ubuntu-latest
              permissions:
                contents: write
              steps:
                - uses: actions/checkout@v4
                - name: نصب yt-dlp
                  run: pip3 install yt-dlp
                - name: دانلود فیلم
                  run: |
                    VIDEO_INFO=$(cat file/videos_info.json)
                    V_NUM="${{ github.event.inputs.video_number }}"
                    VIDEO_URL=$(echo "$VIDEO_INFO" | jq -r ".[$((V_NUM-1))].url")
                    VIDEO_TITLE=$(echo "$VIDEO_INFO" | jq -r ".[$((V_NUM-1))].title")
                    echo "در حال دانلود: $VIDEO_TITLE"
                    yt-dlp -f best -o "video_${V_NUM}.mp4" "$VIDEO_URL"
                - name: آپلود فایل
                  uses: actions/upload-artifact@v4
                  with:
                    name: downloaded-video
                    path: video_*.mp4
          YEOF
          # جایگزینی TOTAL با مقدار واقعی
          sed -i "s/TOTAL/$TOTAL_VIDEOS/g" .github/workflows/download-video.yml
          echo "فایل پویا ساخته شد"

      - name: ذخیره در مخزن (اصلاح شده)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # دریافت آخرین تغییرات
          echo "دریافت آخرین تغییرات از مخزن..."
          git pull origin ${{ github.ref_name }} --rebase || true
          
          # اضافه کردن فایل‌ها
          git add file/ .github/workflows/download-video.yml
          
          # بررسی وجود تغییر
          if git diff --staged --quiet; then
            echo "هیچ تغییر جدیدی برای commit وجود ندارد"
          else
            git commit -m "استخراج فیلم از ${{ github.event.inputs.page_url }}"
            
            # تلاش برای push با چندبار تکرار
            for i in 1 2 3; do
              echo "تلاش $i برای push..."
              if git push origin HEAD:${{ github.ref_name }}; then
                echo "✅ فایل‌ها با موفقیت ذخیره شدند"
                break
              else
                echo "تلاش $i ناموفق، در حال دریافت تغییرات جدید..."
                git pull origin ${{ github.ref_name }} --rebase
                sleep 3
              fi
            done
          fi

      - name: نمایش نتایج
        run: |
          VIDEO_COUNT=$(cat file/videos_info.json 2>/dev/null | jq '. | length' || echo "0")
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ استخراج با موفقیت انجام شد"
          echo "═══════════════════════════════════════════════════════════"
          echo "📁 پوشه: file/"
          echo "🎬 تعداد فیلم‌ها: $VIDEO_COUNT"
          echo "📸 اسکرین‌شات: file/screenshots/fullpage.png"
          echo "═══════════════════════════════════════════════════════════"

      - name: آپلود به عنوان Artifact (پشتیبان)
        uses: actions/upload-artifact@v4
        with:
          name: extracted-video-links
          path: file/