name: DNS Tunnel via Iodine

on:
  workflow_dispatch:

jobs:
  dns-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install Iodine
        run: |
          sudo apt-get update
          sudo apt-get install -y iodine dnsutils

      - name: Setup DNS Tunnel Server
        run: |
          # ایجاد تونل DNS روی پورت 53
          sudo iodined -f -c -P MySecretPass123 10.0.0.1 tunnel.local &
          sleep 5
          
          echo "DNS Tunnel Server Running"
          echo "Server IP: 10.0.0.1"
          echo "Password: MySecretPass123"

      - name: Install Cloudflared for Public Access
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
          
          # تونل DNS را از طریق Cloudflare暴露 کن
          cloudflared tunnel --url dns://localhost:53 &
          sleep 10
          
          TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "DNS Tunnel Public URL: $TUNNEL_URL"
