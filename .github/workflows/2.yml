name: Tunnel with Proper Service

on:
  workflow_dispatch:
    inputs:
      service_type:
        description: 'نوع سرویس (web یا socks)'
        required: true
        type: choice
        default: 'web'
        options:
          - web
          - socks

jobs:
  run-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: نصب ابزارهای مورد نیاز
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget python3
          # نصب cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: راه‌اندازی سرویس وب (در صورت انتخاب)
        if: ${{ github.event.inputs.service_type == 'web' }}
        run: |
          # ساخت یک صفحه HTML ساده
          cat > index.html << EOF
          <!DOCTYPE html>
          <html>
          <head><title>سرویس ابری گیت‌هاب</title></head>
          <body style="font-family:Arial;text-align:center;padding:50px;">
              <h1>✅ سرویس با موفقیت اجرا شد!</h1>
              <p>این صفحه از طریق تونل Cloudflare در دسترس است.</p>
              <p>زمان: $(date)</p>
          </body>
          </html>
          EOF
          
          # اجرای وب سرور روی پورت 8080
          python3 -m http.server 8080 &
          echo "✅ وب سرور روی پورت 8080 اجرا شد."

      - name: راه‌اندازی پروکسی SOCKS5 (در صورت انتخاب)
        if: ${{ github.event.inputs.service_type == 'socks' }}
        run: |
          # نصب و راه‌اندازی پروکسی SOCKS5
          sudo apt-get install -y dante-server
          sudo bash -c 'cat > /etc/danted.conf << EOF
          logoutput: syslog
          internal: 0.0.0.0 port=1080
          external: eth0
          method: none
          client pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
          }
          pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              protocol: tcp udp
          }
          EOF'
          sudo systemctl start danted
          echo "✅ SOCKS5 پروکسی روی پورت 1080 اجرا شد."

      - name: ایجاد تونل عمومی با Cloudflare
        run: |
          # تعیین پورت بر اساس نوع سرویس
          if [ "${{ github.event.inputs.service_type }}" == "web" ]; then
            PORT=8080
          else
            PORT=1080
          fi
          
          # اجرای تونل به سمت پورت سرویس
          cloudflared tunnel --url http://localhost:$PORT &
          sleep 15
          
          # دریافت آدرس عمومی
          TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ تونل با موفقیت برقرار شد!"
          echo "═══════════════════════════════════════════════════════════"
          echo "🔗 آدرس عمومی: $TUNNEL_URL"
          echo "📌 نوع سرویس: ${{ github.event.inputs.service_type }}"
          if [ "${{ github.event.inputs.service_type }}" == "web" ]; then
            echo "🌐 اکنون می‌توانید آدرس بالا را در مرورگر باز کنید"
          else
            echo "🔒 از این آدرس به عنوان پروکسی SOCKS5 استفاده کنید (پورت 80)"
          fi
          echo "═══════════════════════════════════════════════════════════"
          
          # نگهداری سرویس
          tail -f /dev/null