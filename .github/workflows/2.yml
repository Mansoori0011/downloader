name: Web Proxy (No VNC)

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl

      - name: Create Proxy
        run: |
          cat > index.php << 'EOF'
          <?php
          $url = $_GET['url'] ?? '';
          if ($url) {
              $ch = curl_init();
              curl_setopt($ch, CURLOPT_URL, $url);
              curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
              curl_setopt($ch, CURLOPT_FOLLOWLOCATION, true);
              curl_setopt($ch, CURLOPT_USERAGENT, 'Mozilla/5.0');
              curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);
              $content = curl_exec($ch);
              curl_close($ch);
              echo $content;
          } else {
          ?>
          <!DOCTYPE html>
          <html>
          <head><title>GitHub Proxy</title></head>
          <body style="font-family:Arial;text-align:center;padding:50px">
          <h1>🌐 GitHub Web Proxy</h1>
          <form method="get">
              <input type="text" name="url" placeholder="https://google.com" size="50">
              <button type="submit">Go</button>
          </form>
          </body>
          </html>
          <?php } ?>
          EOF

      - name: Install LocalTunnel
        run: |
          npm install -g localtunnel

      - name: Run Proxy
        run: |
          php -S 0.0.0.0:8080 &
          sleep 3
          
          lt --port 8080 --subdomain githubwebproxy >> tunnel.log 2>&1 &
          sleep 15
          
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.loca\.lt' tunnel.log | head -1)
          
          echo "========================================="
          echo "✅ Web Proxy آماده است!"
          echo "========================================="
          echo "لینک را در مرورگر خود باز کن:"
          echo "$TUNNEL_URL"
          echo "========================================="
          
          tail -f /dev/null
